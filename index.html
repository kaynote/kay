<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Kay Notes Archive</title>

<link rel="stylesheet" href="style.css?v=10">
</head>

<body>

<header>
  <h1>Kay Notes Archive</h1>

  <div id="userInfo">로그인 안 됨</div>

  <div class="authArea">
    <button id="loginBtn">로그인</button>
    <button id="logoutBtn">로그아웃</button>
  </div>

  <input type="text" id="searchBox" placeholder="검색...">
</header>

<div id="peopleContainer"></div>

<!-- MODAL -->
<div id="modal" class="modal hidden">
  <div class="modal-content">
    <button id="closeModal" class="closeBtn">✕</button>
    <div id="modalBody"></div>
  </div>
</div>

<!-- NOTIFICATION UI -->
<div id="notify" class="notify"></div>
<div id="notificationList"></div>

<button id="bellBtn">🔔 <span id="badge">0</span></button>

<!-- 🔥 오직 main.js 하나만 -->
<script type="module" src="./main.js?v=10"></script>

</body>
</html>
