<!DOCTYPE html>
<html lang="ko">

<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Kay Notes Archive</title>

<!-- 🔥 캐시 방지 -->
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">

<!-- 🔥 CSS 버전 -->
<link rel="stylesheet" href="style.css?v=3">

<style>
#peopleContainer{
    contain:layout paint;
}
</style>

</head>

<body>

<header>
    <h1>Kay Notes Archive</h1>

    <input
        type="text"
        id="searchBox"
        placeholder="검색..."
    >
</header>

<div id="peopleContainer"></div>

<script type="module">

/* 🔥 JS도 캐시 방지 */
import people from "./people.js?v=3";

import { db, auth } from "./firebase.js";

import {
  doc,
  setDoc,
  deleteDoc,
  getDocs,
  collection,
  addDoc,
  query,
  orderBy
}
from "https://www.gstatic.com/firebasejs/12.0.0/firebase-firestore.js";

const container =
    document.getElementById("peopleContainer");

const searchBox =
    document.getElementById("searchBox");

let data = [];

let renderedMap = new Map();

/* INIT */
function init(){
    if(!Array.isArray(people)) return;
    data = people;
    render(data);
}

/* CARD */
function createCard(p, index){

    const likeBtn =
        actions.querySelector(".likeBtn");

    const likeCountEl =
        actions.querySelector(".likeCount");

    const card = document.createElement("div");
    card.className = "card";

    const photo = document.createElement("div");
    photo.className = "photo";

    const img = document.createElement("img");

    img.src = p.image
        ? "images/" + p.image
        : "images/no-image.jpg";

    img.loading = "lazy";
    img.decoding = "async";

    photo.appendChild(img);

    const info = document.createElement("div");
    info.className = "info";

    const nameEl = document.createElement("div");
    nameEl.className = "name";

    const enEl = document.createElement("div");
    enEl.className = "en";

    const no = (p.no || (index + 1));

    enEl.innerHTML =
        `<span class="num">${no}.</span>
         <span class="txt">${p.name || ""}</span>`;

    const koEl = document.createElement("div");
    koEl.className = "ko";
    koEl.textContent = p.ko || "";

    nameEl.appendChild(enEl);

    if(p.ko){
        nameEl.appendChild(koEl);
    }

    const metaEl = document.createElement("div");
    metaEl.className = "meta";
    metaEl.textContent = p.tags ? p.tags.join(" · ") : "";

    const descEl = document.createElement("div");
    descEl.className = "desc";
    descEl.innerHTML = p.note || "";

    info.appendChild(nameEl);
    info.appendChild(metaEl);
    info.appendChild(descEl);
    
    const actions = document.createElement("div");
    actions.className = "actions";

    actions.innerHTML = `
        <button class="likeBtn">
            👍 좋아요
        </button>

        <span class="likeCount">
            0
        </span>
    `;

    info.appendChild(actions);

    card.appendChild(photo);
    card.appendChild(info);

    return card;
}

/* RENDER */
function render(list){

    const fragment = document.createDocumentFragment();

    list.forEach((p, index) => {

        const key = (p.no || index) + "_" + p.name;

        if(renderedMap.has(key)){
            fragment.appendChild(renderedMap.get(key));
        }else{
            const card = createCard(p, index);
            renderedMap.set(key, card);
            fragment.appendChild(card);
        }
    });

    container.replaceChildren(fragment);
}

/* SEARCH */
function debounce(fn, delay = 150){
    let t;
    return (...args) => {
        clearTimeout(t);
        t = setTimeout(() => fn(...args), delay);
    };
}

const handleSearch = debounce((value) => {

    const k = value.toLowerCase();

    const filtered = data.filter(p =>
        (p.name || "").toLowerCase().includes(k) ||
        (p.ko || "").toLowerCase().includes(k) ||
        (p.note || "").toLowerCase().includes(k)
    );

    render(filtered);

}, 150);

searchBox.addEventListener("input", e => {
    handleSearch(e.target.value);
});

/* START */
init();

</script>

</body>
</html>
