<script type="module">

import people from "./people.js?v=3";

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.0.0/firebase-app.js";
import {
  getAuth,
  GoogleAuthProvider,
  signInWithPopup,
  signOut,
  onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.0.0/firebase-auth.js";

import {
  getFirestore,
  collection,
  addDoc,
  getDocs,
  query,
  orderBy,
  serverTimestamp,
  deleteDoc,
  doc,
  getDoc,
  setDoc
} from "https://www.gstatic.com/firebasejs/12.0.0/firebase-firestore.js";

/* Firebase */
const firebaseConfig = {
  apiKey: "AIzaSyCAZzJdAB_a65dkJaL-XLQqzImzlSI8Gmw",
  authDomain: "kay-gallery.firebaseapp.com",
  projectId: "kay-gallery",
  storageBucket: "kay-gallery.firebasestorage.app",
  messagingSenderId: "276470297982",
  appId: "1:276470297982:web:838b8a57269b26cd3d6f2f"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

/* DOM SAFE GET */
const container = document.getElementById("peopleContainer");
const searchBox = document.getElementById("searchBox");
const loginBtn = document.getElementById("loginBtn");
const logoutBtn = document.getElementById("logoutBtn");
const userBox = document.getElementById("userBox");

let data = [];
let renderedMap = new Map();
let currentPersonNo = null;

/* INIT */
function init() {
  if (!Array.isArray(people)) return;
  data = people;
  render(data);
}

/* CARD */
function createCard(p, index) {

  const card = document.createElement("div");
  card.className = "card";

  const photo = document.createElement("div");
  photo.className = "photo";

  const img = document.createElement("img");
  img.src = p.image ? "images/" + p.image : "images/no-image.jpg";
  img.loading = "lazy";
  img.decoding = "async";
  photo.appendChild(img);

  const info = document.createElement("div");
  info.className = "info";

  const no = p.no || (index + 1);

  const nameEl = document.createElement("div");
  nameEl.className = "name";

  nameEl.innerHTML = `
    <div class="en">
      <span class="num">${no}.</span>
      <span class="txt">${p.name || ""}</span>
    </div>
  `;

  if (p.ko) {
    const koEl = document.createElement("div");
    koEl.className = "ko";
    koEl.textContent = p.ko;
    nameEl.appendChild(koEl);
  }

  const metaEl = document.createElement("div");
  metaEl.className = "meta";
  metaEl.textContent = p.tags ? p.tags.join(" · ") : "";

  const descEl = document.createElement("div");
  descEl.className = "desc";
  descEl.innerHTML = p.note || "";

  /* ACTIONS */
  const actions = document.createElement("div");
  actions.className = "actions";

  actions.innerHTML = `
    <button class="likeBtn">👍 0</button>
    <button class="viewLikesBtn">👥 추천자</button>
    <button class="commentBtn">💬 댓글</button>
  `;

  const likeBtn = actions.querySelector(".likeBtn");
  const viewLikesBtn = actions.querySelector(".viewLikesBtn");
  const commentBtn = actions.querySelector(".commentBtn");

  likeBtn.style.transition = "0.2s";

  /* LIKE COUNT */
  async function loadLikeCount() {
    if (!container) return;

    const snap = await getDocs(
      collection(db, "likes", String(no), "users")
    );

    likeBtn.textContent = `👍 ${snap.size}`;
  }

  loadLikeCount();

  /* LIKE TOGGLE */
  likeBtn.addEventListener("click", async () => {

    const user = auth.currentUser;
    if (!user) return alert("로그인 후 추천 가능합니다.");

    const userRef = doc(db, "likes", String(no), "users", user.uid);

    const userSnap = await getDoc(userRef);

    if (userSnap.exists()) {
      await deleteDoc(userRef);
    } else {
      await setDoc(userRef, {
        name: user.displayName,
        createdAt: serverTimestamp()
      });
    }

    await loadLikeCount();
  });

  /* VIEW LIKES */
  viewLikesBtn.addEventListener("click", async () => {

    const snap = await getDocs(
      collection(db, "likes", String(no), "users")
    );

    const names = [];

    snap.forEach(d => {
      const data = d.data();
      if (data.name) names.push(data.name);
    });

    alert(
      names.length
        ? "추천한 회원\n\n" + names.join("\n")
        : "추천한 회원이 없습니다."
    );
  });

  /* COMMENT */
  commentBtn.addEventListener("click", async () => {

    const modal = document.getElementById("commentModal");
    const title = document.getElementById("modalTitle");

    if (!modal || !title) return;

    currentPersonNo = String(no);
    title.textContent = p.name || "";
    modal.style.display = "block";

    await loadComments();
  });

  info.appendChild(nameEl);
  info.appendChild(metaEl);
  info.appendChild(descEl);
  info.appendChild(actions);

  card.appendChild(photo);
  card.appendChild(info);

  return card;
}

/* RENDER */
function render(list) {

  const fragment = document.createDocumentFragment();

  list.forEach((p, index) => {

    const key = (p.no || index) + "_" + p.name;

    if (renderedMap.has(key)) {
      fragment.appendChild(renderedMap.get(key));
    } else {
      const card = createCard(p, index);
      renderedMap.set(key, card);
      fragment.appendChild(card);
    }
  });

  if (container) container.replaceChildren(fragment);
}

/* SEARCH */
function debounce(fn, delay = 150) {
  let t;
  return (...args) => {
    clearTimeout(t);
    t = setTimeout(() => fn(...args), delay);
  };
}

if (searchBox) {
  searchBox.addEventListener("input", debounce(e => {

    const k = e.target.value.toLowerCase();

    render(
      data.filter(p =>
        (p.name || "").toLowerCase().includes(k) ||
        (p.ko || "").toLowerCase().includes(k) ||
        (p.note || "").toLowerCase().includes(k)
      )
    );

  }, 150));
}

/* AUTH */
if (loginBtn) {
  loginBtn.addEventListener("click", async () => {
    const provider = new GoogleAuthProvider();
    await signInWithPopup(auth, provider);
  });
}

if (logoutBtn) {
  logoutBtn.addEventListener("click", async () => {
    await signOut(auth);
  });
}

onAuthStateChanged(auth, user => {

  if (loginBtn && logoutBtn && userBox) {

    loginBtn.hidden = !!user;
    logoutBtn.hidden = !user;
    userBox.textContent = user ? `👤 ${user.displayName}` : "";
  }
});

/* COMMENTS */
async function loadComments() {

  const commentList = document.getElementById("commentList");
  if (!commentList) return;

  commentList.innerHTML = "";

  const q = query(
    collection(db, "comments", currentPersonNo, "items"),
    orderBy("createdAt", "asc")
  );

  const snap = await getDocs(q);

  snap.forEach(commentDoc => {

    const d = commentDoc.data();

    const div = document.createElement("div");
    div.style.padding = "8px 0";
    div.style.borderBottom = "1px solid #eee";

    div.innerHTML = `<b>${d.user}</b><br>${d.text}`;

    const user = auth.currentUser;

    if (user && (user.uid === d.uid)) {

      const delBtn = document.createElement("button");
      delBtn.textContent = "삭제";

      delBtn.onclick = async () => {
        await deleteDoc(
          doc(db, "comments", currentPersonNo, "items", commentDoc.id)
        );
        await loadComments();
      };

      div.appendChild(delBtn);
    }

    commentList.appendChild(div);
  });
}

/* SAVE COMMENT */
const saveBtn = document.getElementById("saveComment");

if (saveBtn) {
  saveBtn.addEventListener("click", async () => {

    const user = auth.currentUser;
    if (!user) return alert("로그인 후 작성 가능합니다.");

    const input = document.getElementById("commentInput");
    if (!input) return;

    const text = input.value.trim();
    if (!text) return;

    await addDoc(
      collection(db, "comments", currentPersonNo, "items"),
      {
        text,
        user: user.displayName,
        uid: user.uid,
        createdAt: serverTimestamp()
      }
    );

    input.value = "";
    await loadComments();
  });
}

/* START */
init();

</script>
