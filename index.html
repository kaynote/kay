/* =========================
   CARD
========================= */

function createCard(p, index){

    const card = document.createElement("div");
    card.className = "card";

    const img = document.createElement("img");
    img.src = p.image ? "images/" + p.image : "images/no-image.jpg";
    img.loading = "lazy";
    img.decoding = "async";

    const photo = document.createElement("div");
    photo.className = "photo";
    photo.appendChild(img);

    const info = document.createElement("div");
    info.className = "info";

    const nameEl = document.createElement("div");
    nameEl.className = "name";

    const enEl = document.createElement("div");
    enEl.className = "en";

    const no = p.no || (index + 1);

    enEl.innerHTML = `
        <span class="num">${no}.</span>
        <span class="txt">${p.name || ""}</span>
    `;

    nameEl.appendChild(enEl);

    if(p.ko){
        const koEl = document.createElement("div");
        koEl.className = "ko";
        koEl.textContent = p.ko;
        nameEl.appendChild(koEl);
    }

    const metaEl = document.createElement("div");
    metaEl.className = "meta";
    metaEl.textContent = p.tags ? p.tags.join(" · ") : "";

    const descEl = document.createElement("div");
    descEl.className = "desc";
    descEl.innerHTML = p.note || "";

    info.appendChild(nameEl);
    info.appendChild(metaEl);
    info.appendChild(descEl);

    card.appendChild(photo);
    card.appendChild(info);

    card.addEventListener("click", () => openModal(p));

    return card;
}

/* =========================
   RENDER
========================= */

function render(list){

    const fragment = document.createDocumentFragment();

    list.forEach((p, index)=>{

        const key = (p.no || index) + "_" + p.name;

        if(renderedMap.has(key)){
            fragment.appendChild(renderedMap.get(key));
        } else {
            const card = createCard(p, index);
            renderedMap.set(key, card);
            fragment.appendChild(card);
        }
    });

    container.replaceChildren(fragment);
}

/* =========================
   SEARCH

function debounce(fn, delay = 150){
    let t;
    return (...args)=>{
        clearTimeout(t);
        t = setTimeout(()=>fn(...args), delay);
    };
}

const handleSearch = debounce(value=>{
    const k = value.toLowerCase();

    const filtered = data.filter(p =>
        (p.name || "").toLowerCase().includes(k) ||
        (p.ko || "").toLowerCase().includes(k) ||
        (p.note || "").toLowerCase().includes(k)
    );

    render(filtered);
});

searchBox.addEventListener("input", e=>{
    handleSearch(e.target.value);
});

function formatDate(ts){
    if(!ts) return "";

    const d = ts.toDate();

    const yyyy = d.getFullYear();
    const mm = String(d.getMonth()+1).padStart(2,"0");
    const dd = String(d.getDate()).padStart(2,"0");

    const hh = String(d.getHours()).padStart(2,"0");
    const mi = String(d.getMinutes()).padStart(2,"0");
    const ss = String(d.getSeconds()).padStart(2,"0");

    return `${yyyy}-${mm}-${dd} ${hh}:${mi}:${ss}`;
}

    /* =====================

    async function loadComments(){

        const q = query(
            collection(db, "people", p.name, "comments"),
            orderBy("createdAt", "asc")
        );

        const snap = await getDocs(q);

        const list = snap.docs.map(d => ({
            id: d.id,
            ...d.data()
        }));

        commentCountEl.textContent = list.length;

        // 1. map 생성
        const map = {};
        const roots = [];

        list.forEach(c => {
            map[c.id] = { ...c, replies: [] };
        });

        // 2. 트리 연결 (핵심 수정 버전)
        list.forEach(c => {

            const node = map[c.id];

            // 부모가 존재하고, 자기 자신이 아닌 경우만 자식으로 연결
            if (c.parentId && map[c.parentId] && c.parentId !== c.id) {
                map[c.parentId].replies.push(node);
            } else {
                roots.push(node);
            }
        });

        // 3. 렌더 초기화
        commentsDiv.innerHTML = "";

        // 4. 루트부터 렌더
        roots.forEach(c => {
            commentsDiv.appendChild(renderComment(c));
        });
    }

    function renderComment(c, depth = 0){

        const div = document.createElement("div");
        div.className = "comment";

        div.id = `comment-${c.id}`;
        div.style.marginLeft = `${depth * 20}px`;

        div.innerHTML = `
            <div class="commentRow">
                <div class="left">
                    <img src="${c.photo || 'images/no-image.jpg'}">
                    <span class="name">${c.name}</span>: 
                </div>
      
                <div class="text">
                    ${
                        c.deleted
                        ? `<span class="deleted-comment">삭제된 댓글입니다.</span>`
                        : c.text
                    }
                </div>

                <div class="right">
                    <span class="time">
                        ${c.createdAt ? formatDate(c.createdAt) : ""}
                    </span>
                    ${
                        c.editedAt && !c.deleted
                        ? `<span class="edited">수정됨</span>`
                        : ""
                    }
                </div>
            </div>
        `;

        const action = document.createElement("div");
        action.className = "actions";
        
        // ======================
        // 권한 체크 (삭제/수정)
        // ======================
        const isOwner =
            auth.currentUser &&
            (auth.currentUser.uid === c.uid ||
             auth.currentUser.email === ADMIN_EMAIL);
        
        const isAdmin =
            auth.currentUser?.email === ADMIN_EMAIL;

        if (isAdmin && c.deleted) {

            const forceDelBtn = document.createElement("button");
            forceDelBtn.textContent = "완전삭제";
            
            const viewBtn = document.createElement("button");
            viewBtn.textContent = "원문 보기";

            viewBtn.onclick = () => {

                const old = div.querySelector(".original-comment");

                if (old) {
                    old.remove();
                    viewBtn.textContent = "원문 보기";
                    return;
                }

                const box = document.createElement("div");
                box.className = "original-comment";

                box.style.margin = "10px 0";
                box.style.padding = "10px";
                box.style.background = "#fff8dc";
                box.style.border = "1px solid #e0c97f";
                box.style.borderRadius = "8px";

                box.innerHTML = `
                    <b>원래 댓글</b><br><br>
                    ${c.originalText || "(내용 없음)"}
                `;

                div.insertBefore(box, action);

                viewBtn.textContent = "원문 숨기기";
            };

            action.appendChild(viewBtn);

            forceDelBtn.onclick = async () => {

                if (!confirm("삭제된 댓글과 모든 답글을 완전히 삭제할까요?")) {
                    return;
                }

                // 현재 게시글의 댓글 전체 조회
                const snap = await getDocs(
                    collection(db, "people", p.name, "comments")
                );

                const all = snap.docs.map(d => ({
                    id: d.id,
                    ...d.data()
                }));

                // 삭제 대상(부모 + 모든 자식)
                const targets = new Set([c.id]);

                let changed = true;

                while (changed) {

                    changed = false;

                    for (const item of all) {

                        if (
                            item.parentId &&
                            targets.has(item.parentId) &&
                            !targets.has(item.id)
                        ) {
                            targets.add(item.id);
                            changed = true;
                        }

                    }

                }

                // 전부 삭제
                await Promise.all(
                    [...targets].map(id =>
                        deleteDoc(
                            doc(db, "people", p.name, "comments", id)
                        )
                    )
                );

                await loadComments();
            };

            action.appendChild(forceDelBtn);

            div.appendChild(action);
        }

        // ======================
        // 답글 버튼
        // ======================
        if (!c.deleted) {
        const replyBtn = document.createElement("button");
        const replyCount = c.replies?.length || 0;
        replyBtn.textContent = replyCount ? `답글 (${replyCount})` : "답글";

        replyBtn.onclick = () => {

            const old = div.querySelector(".inline-reply");
            if (old) old.remove();

            const form = document.createElement("div");
            form.className = "inline-reply";

            form.innerHTML = `
                <textarea placeholder="답글 입력"></textarea>
                <div style="display:flex; gap:6px; margin-top:6px;">
                    <button class="send">전송</button>
                    <button class="cancel">취소</button>
                </div>
            `;

            div.insertBefore(form, action);

            const textarea = form.querySelector("textarea");
            textarea.focus();

            form.querySelector(".send").onclick = async () => {

                const text = textarea.value.trim();

                if (!text) return;

                if (text.length > 1000) {
                    alert("댓글은 1000자 이하만 가능합니다.");
                    return;
                }

                const user = auth.currentUser || await login();

                    const replyRef = await addDoc(
        collection(db, "people", p.name, "comments"),
        {
            uid: user.uid,
            name:
                user.providerData?.[0]?.displayName ||
                user.displayName ||
                user.email ||
                "익명",

            photo: user.photoURL,
            text,
            parentId: c.id,
            createdAt: serverTimestamp()
        }
    );

                // ★ 답글 알림 생성
                const commentsSnap = await getDocs(
                    collection(db, "people", p.name, "comments")
                );

                const targets = new Set();

                commentsSnap.forEach(docItem => {

                    const data = docItem.data();

                    if (data.uid)
                        targets.add(data.uid);

                });

                // 부모 댓글 작성자는 반드시 알림
                targets.add(c.uid);

                // 관리자는 항상 알림
                targets.add(ADMIN_UID);

                // 자기 자신 제외
                targets.delete(user.uid);

                for (const uid of targets) {

                    await addDoc(collection(db, "notifications"), {

                        targetUid: uid,
                        senderUid: user.uid,
                        senderName:
                            user.providerData?.[0]?.displayName ||
                            user.displayName ||
                            user.email ||
                            "익명",

                        postId: p.name,
                        commentId: replyRef.id,
                        type: "reply",
                        read: false,
                        createdAt: serverTimestamp()

                    });

                }
                form.remove();
                loadComments();
            };

            form.querySelector(".cancel").onclick = () => {
                form.remove();
            };
        };

            action.appendChild(replyBtn);
        }

        if (isOwner && !c.deleted) {

            // 수정
            const editBtn = document.createElement("button");
            editBtn.textContent = "수정";

            editBtn.onclick = () => {

                const old = div.querySelector(".inline-edit");
                if (old) old.remove();

                const form = document.createElement("div");
                form.className = "inline-edit";

                form.innerHTML = `
                    <textarea>${c.text}</textarea>
                    <div style="display:flex; gap:6px; margin-top:6px;">
                        <button class="save">저장</button>
                        <button class="cancel">취소</button>
                    </div>
                `;

                div.insertBefore(form, action);

                const textarea = form.querySelector("textarea");
                textarea.focus();

                form.querySelector(".save").onclick = async () => {

                    const newText = textarea.value.trim();

                    if (!newText) return;

                    if (newText.length > 1000) {
                        alert("댓글은 1000자 이하만 가능합니다.");
                        return;
                    }

                    await updateDoc(
                        doc(db, "people", p.name, "comments", c.id),
                        {
                            text: newText,
                            editedAt: serverTimestamp()
                        }
                    );

                    loadComments();
                };

                form.querySelector(".cancel").onclick = () => {
                    form.remove();
                };
            };

            // 삭제
            const delBtn = document.createElement("button");
            delBtn.textContent = "삭제";

            delBtn.onclick = async () => {

                if (!confirm("댓글을 삭제할까요?")) return;

                const isAdmin = auth.currentUser?.email === ADMIN_EMAIL;

                // 🔥 이미 soft delete된 댓글이면 → 무조건 hard delete (관리자 기능)
                if (c.deleted && isAdmin) {
                    await deleteDoc(
                        doc(db, "people", p.name, "comments", c.id)
                    );
                    await loadComments();
                    return;
                }

                // 🔥 기존 로직 그대로
                const snap = await getDocs(
                    collection(db, "people", p.name, "comments")
                );

                const all = snap.docs.map(d => ({
                    id: d.id,
                    ...d.data()
                }));

                const targets = new Set([c.id]);

                let changed = true;

                while (changed) {
                    changed = false;

                    for (const item of all) {
                        if (targets.has(item.parentId) && !targets.has(item.id)) {
                            targets.add(item.id);
                            changed = true;
                        }
                    }
                }

                const hasReplies = all.some(item =>
                    item.parentId === c.id && !item.deleted
                );

                // 일반 유저 soft delete 유지
                if (hasReplies && !isAdmin) {

                    await updateDoc(
                        doc(db, "people", p.name, "comments", c.id),
                        {
                            deleted: true,
                            originalText: c.text,
                            text: "",
                            deletedAt: serverTimestamp()
                        }
                    );

                    await loadComments();
                    return;
                }

                // hard delete
                const deletePromises = [...targets].map(id =>
                    deleteDoc(doc(db, "people", p.name, "comments", id))
                );

                await Promise.all(deletePromises);
                await loadComments();
            };

            action.appendChild(editBtn);
            action.appendChild(delBtn);
        }

        div.appendChild(action);

        // ======================
        // 재귀 렌더
        // ======================

        c.replies.forEach(r => {
            div.appendChild(renderComment(r, depth + 1));
        });

        return div;
    }

    await loadLikes();
    await loadComments();

} // openModal 종료

closeModal.addEventListener("click", ()=>{

    modal.classList.add("hidden");

    if (history.state?.modal) {
        history.back();
    }

});

window.addEventListener("popstate", () => {

    if (!modal.classList.contains("hidden")) {
        modal.classList.add("hidden");
    }

});

modal.addEventListener("click", e=>{

    if(e.target === modal){

        modal.classList.add("hidden");

        if(history.state?.modal){
            history.back();
        }

    }

});

document.addEventListener("keydown", (e)=>{

    if(e.key === "Escape"){

        if(!modal.classList.contains("hidden")){
            modal.classList.add("hidden");
        }

    }

});

logoutBtn.addEventListener("click", logout);

let notifUnsub = null;

watchAuth(user => {

    currentUser = user;

    const userInfo = document.getElementById("userInfo");

    if(!user){

        userInfo.textContent = "로그인 안 됨";
        
        document.getElementById("badge").textContent = "0";
        document.getElementById("notificationList").innerHTML = "";

        loginBtn.style.display = "inline-block";
        logoutBtn.style.display = "none";

        container.innerHTML = `
          <div style="
            width:100%;
            display:flex;
            justify-content:center;
            padding:40px 20px;
            box-sizing:border-box;
          ">
            <div style="
              width:100%;
              max-width:360px;
              background:white;
              border-radius:16px;
              padding:24px;
              box-shadow:0 6px 18px rgba(0,0,0,0.12);
              display:flex;
              flex-direction:column;
              gap:16px;
            ">

              <div style="
                font-size:18px;
                font-weight:700;
                line-height:1.4;
                display:flex;
                justify-content:center;
                align-items:center;
                white-space:nowrap;
                min-width:0;
              ">
                <span style="
                  flex:1;
                  min-width:0;
                  text-align:center;
                ">
                  🔒 로그인 후 이용 가능합니다.
                </span>
              </div>

              <button id="needLoginBtn" style="
                background:#4285F4;
                color:white;
                border:none;
                border-radius:10px;
                padding:12px 14px;
                font-size:15px;
                cursor:pointer;
                width:100%;
              ">
                로그인
              </button>

            </div>
          </div>
        `;
        
        document
            .getElementById("needLoginBtn")
            ?.addEventListener("click", login);

        return;
    }

    userInfo.textContent = user.email;

    loginBtn.style.display = "none";
    logoutBtn.style.display = "inline-block";

    /* =========================
       🔥 알림 구독 (중복 방지 핵심)
    ========================= */

    if (notifUnsub) {
        notifUnsub();
        notifUnsub = null;
    }

    notifUnsub = onSnapshot(
        query(
            collection(db, "notifications"),
            where("targetUid", "==", user.uid)
        ),
        (snap) => {

            const list = [];

            snap.forEach(docItem => {

                list.push({
                    id: docItem.id,
                    ...docItem.data()
                });

            });

            renderNotifications(list);
        }
    );

    /* =========================
       렌더
    ========================= */

    function renderNotifications(list){

        const badge = document.getElementById("badge");

        const unread = list.filter(n => !n.read).length;
        badge.textContent = unread;

        // ⭐ 여기 추가
        badge.style.display = unread ? "inline-block" : "none";

        const box = document.getElementById("notificationList");

        box.innerHTML = `
        <div class="notification-header">

            <button id="deleteAllNotificationsBtn">
                전체 삭제
            </button>

            <button id="deleteReadNotificationsBtn">
                읽은 알림 삭제
            </button>

        </div>
        `;
        
        document.getElementById("deleteAllNotificationsBtn").onclick = async () => {

            if (!currentUser) return;

            if (!confirm("모든 알림을 삭제하시겠습니까?")) return;

            await deleteAllNotifications(currentUser.uid);
        };

        document.getElementById("deleteReadNotificationsBtn").onclick = async () => {

            if (!currentUser) return;

            if (!confirm("읽은 알림만 삭제하시겠습니까?")) return;

            await deleteReadNotifications(currentUser.uid);
        };

        list
            .sort((a,b)=> (b.createdAt?.seconds || 0) - (a.createdAt?.seconds || 0))
            .forEach(n => {

                const div = document.createElement("div");
                div.className = "notification-item";

                // ★ 추가
                div.classList.add(n.read ? "read" : "unread");

                div.onclick = async () => {
                    await openNotification(n);
                };

                // 알림 내용
                // 알림 내용
                const text = document.createElement("span");

                const mark = n.read ? "⚪" : "🔵";

                if (n.type === "comment") {

                    text.textContent =
                        `${mark} ${n.senderName} 님이 "${n.postId}" 게시글에 댓글을 남겼습니다`;

                } else {

                    text.textContent =
                        `${mark} ${n.senderName} 님이 "${n.postId}" 게시글에 답글을 남겼습니다`;

                }

                // X 버튼
                const delBtn = document.createElement("button");
                delBtn.textContent = "✕";
                delBtn.className = "notification-delete";

                delBtn.onclick = async (e) => {
                    e.stopPropagation();

                    if (!confirm("이 알림을 삭제할까요?")) return;

                    await deleteDoc(
                        doc(db, "notifications", n.id)
                    );
                };

                div.appendChild(text);
                div.appendChild(delBtn);

                box.appendChild(div);
            });
    }

    async function openNotification(n){

        try {
            await updateDoc(
                doc(db, "notifications", n.id),
                { read: true }
            );
        } catch (e) {
            console.warn(e);
        }

        const person = people.find(
            p => p.name === n.postId
        );

        if (!person) return;

        openModal(person);

        // 🔥 여기 핵심 추가
        setTimeout(() => {

            if (n.commentId) {
                const target = document.getElementById(`comment-${n.commentId}`);

                if (target) {
                    target.scrollIntoView({
                        behavior: "smooth",
                        block: "center",
                        inline: "nearest"
                    });

                    // 살짝 강조 효과
                    target.style.background = "#fff3cd";
                    target.style.transition = "0.3s";

                    setTimeout(() => {
                        target.style.background = "";
                    }, 1500);
                }
            }

        }, 300); // 모달 렌더 기다림
    }

    /* =========================
       BELL
    ========================= */

    init();
});
