<script type="module">

import people from "./people.js";

let container = null;
let searchBox = null;

let data = [];

/* =========================
   DOM INIT (강화 버전)
========================= */
function initDOM() {

    container = document.getElementById("peopleContainer");
    searchBox = document.getElementById("searchBox");

    // 🔥 디버그 로그 (무조건 확인 가능)
    console.log("container:", container);
    console.log("searchBox:", searchBox);

    if (!container) {
        console.error("❌ peopleContainer 없음 → HTML에 <div id='peopleContainer'></div> 추가 필요");
        return false;
    }

    if (!searchBox) {
        console.error("❌ searchBox 없음 → HTML에 <input id='searchBox' /> 추가 필요");
        return false;
    }

    return true;
}

/* =========================
   DATA INIT
========================= */
function initData() {

    if (!Array.isArray(people)) {
        console.error("❌ people.js 데이터가 배열이 아님");
        return;
    }

    data = people;

    console.log("✅ 데이터 로드 완료:", data.length);

    render(data);
}

/* =========================
   RENDER (강화 안정형)
========================= */
function render(list) {

    if (!container) {
        console.error("❌ container 없음 (렌더 중단)");
        return;
    }

    // 빈 데이터 처리
    if (!list || list.length === 0) {
        container.innerHTML = "<p>데이터 없음</p>";
        return;
    }

    const fragment = document.createDocumentFragment();

    list.forEach((p, index) => {

        const card = document.createElement("div");
        card.className = "card";

        const photo = document.createElement("div");
        photo.className = "photo";

        const img = document.createElement("img");

        img.src = p.image
            ? "images/" + p.image
            : "images/no-image.jpg";

        img.loading = "lazy";

        photo.appendChild(img);

        const info = document.createElement("div");
        info.className = "info";

        const nameEl = document.createElement("div");
        nameEl.className = "name";

        nameEl.innerHTML =
            `<span class="num">${p.no || index + 1}.</span>
             <span class="txt">${p.name || ""}</span>`;

        const descEl = document.createElement("div");
        descEl.className = "desc";

        descEl.innerHTML = p.displayName || p.note || "";

        info.appendChild(nameEl);
        info.appendChild(descEl);

        card.appendChild(photo);
        card.appendChild(info);

        fragment.appendChild(card);
    });

    container.replaceChildren(fragment);

    console.log("🎨 렌더 완료:", list.length);
}

/* =========================
   SEARCH
========================= */
function handleSearch(value) {

    const k = (value || "").toLowerCase();

    const filtered = data.filter(p =>
        (p.name || "").toLowerCase().includes(k) ||
        (p.ko || "").toLowerCase().includes(k) ||
        (p.note || "").toLowerCase().includes(k)
    );

    render(filtered);
}

/* =========================
   BOOT
========================= */
document.addEventListener("DOMContentLoaded", () => {

    console.log("🚀 DOM Loaded");

    const ok = initDOM();
    if (!ok) return;

    searchBox.addEventListener("input", (e) => {
        handleSearch(e.target.value);
    });

    initData();
});

</script>
