<script type="module">

import people from "./people.js";

const container =
    document.getElementById("peopleContainer");

const searchBox =
    document.getElementById("searchBox");

let data = [];

/* =========================
   TIMESTAMP COLORIZE
========================= */
function colorizeTimestamp(text){

    if(!text) return "";

    return text.replace(

        /(\d{4}\.\d{2}\.\d{2}\s+\d{1,2}:\d{2}(?::\d{2})?)/g,

        '<span class="timestamp">$1</span>'
    );
}

/* =========================
   INIT
========================= */
function init(){

    data = Array.isArray(people)
        ? people
        : [];

    render(data);
}

/* =========================
   CREATE CARD
========================= */
function createCard(p, index){

    const card =
        document.createElement("div");

    card.className = "card";

    const no =
        p.no || (index + 1);

    card.innerHTML = `

        <div class="photo">
            <img
                src="${
                    p.image
                        ? "images/" + p.image
                        : "images/no-image.jpg"
                }"
                loading="lazy"
                decoding="async"
            >
        </div>

        <div class="info">

            <div class="name">

                <div class="en">
                    <span class="num">${no}.</span>
                    <span class="txt">${p.name || ""}</span>
                </div>

                ${
                    p.ko
                    ? `<div class="ko">${p.ko}</div>`
                    : ""
                }

            </div>

            <div class="meta">
                ${
                    p.tags
                    ? p.tags.join(" · ")
                    : ""
                }
            </div>

            <div class="desc">
                ${colorizeTimestamp(p.note || "")}
            </div>

        </div>
    `;

    return card;
}

/* =========================
   RENDER
========================= */
function render(list){

    const fragment =
        document.createDocumentFragment();

    list.forEach((p, index) => {

        fragment.appendChild(
            createCard(p, index)
        );

    });

    container.replaceChildren(fragment);
}

/* =========================
   SEARCH
========================= */
function debounce(fn, delay = 150){

    let timer;

    return (...args) => {

        clearTimeout(timer);

        timer = setTimeout(
            () => fn(...args),
            delay
        );
    };
}

const handleSearch =
    debounce(value => {

        const k =
            value.toLowerCase();

        render(

            data.filter(p =>

                (p.name || "")
                    .toLowerCase()
                    .includes(k)

                ||

                (p.ko || "")
                    .toLowerCase()
                    .includes(k)

                ||

                (p.note || "")
                    .toLowerCase()
                    .includes(k)
            )
        );

    });

searchBox.addEventListener(
    "input",
    e => handleSearch(e.target.value)
);

/* =========================
   START
========================= */
init();

</script>
