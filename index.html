<script type="module">

import people from "./people.js";

let container = null;
let searchBox = null;

let data = [];

/* =========================
   INIT DOM
========================= */
function initDOM() {
    container = document.getElementById("peopleContainer");
    searchBox = document.getElementById("searchBox");

    if (!container) {
        console.error("❌ peopleContainer 없음 (HTML 확인 필요)");
        return false;
    }

    if (!searchBox) {
        console.error("❌ searchBox 없음 (HTML 확인 필요)");
        return false;
    }

    return true;
}

/* =========================
   INIT DATA
========================= */
function initData() {

    if (!Array.isArray(people)) {
        console.error("❌ people.js 데이터가 배열이 아님");
        return;
    }

    data = people;
    render(data);
}

/* =========================
   RENDER
========================= */
function render(list) {

    if (!container) return;

    const fragment = document.createDocumentFragment();

    list.forEach((p, index) => {

        const card = document.createElement("div");
        card.className = "card";

        const photo = document.createElement("div");
        photo.className = "photo";

        const img = document.createElement("img");

        img.src = p.image
            ? "images/" + p.image
            : "images/no-image.jpg";

        img.loading = "lazy";

        photo.appendChild(img);

        const info = document.createElement("div");
        info.className = "info";

        const nameEl = document.createElement("div");
        nameEl.className = "name";

        nameEl.innerHTML =
            `<span class="num">${p.no || index + 1}.</span>
             <span class="txt">${p.name || ""}</span>`;

        const descEl = document.createElement("div");
        descEl.className = "desc";

        descEl.innerHTML = p.displayName || p.note || "";

        info.appendChild(nameEl);
        info.appendChild(descEl);

        card.appendChild(photo);
        card.appendChild(info);

        fragment.appendChild(card);
    });

    container.replaceChildren(fragment);
}

/* =========================
   SEARCH
========================= */
function handleSearch(value) {

    const k = (value || "").toLowerCase();

    const filtered = data.filter(p =>
        (p.name || "").toLowerCase().includes(k) ||
        (p.ko || "").toLowerCase().includes(k) ||
        (p.note || "").toLowerCase().includes(k)
    );

    render(filtered);
}

/* =========================
   BOOT
========================= */
document.addEventListener("DOMContentLoaded", () => {

    // DOM 먼저 체크
    const ok = initDOM();
    if (!ok) return;

    // 이벤트 연결
    searchBox.addEventListener("input", (e) => {
        handleSearch(e.target.value);
    });

    // 데이터 초기화
    initData();
});

</script>
