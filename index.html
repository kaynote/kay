<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kay Notes Archive</title>

<link rel="stylesheet" href="style.css">

<style>
/* 🔥 최소 안전 스타일 (JS 안 떠도 화면 안 깨짐) */
#peopleContainer {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
  gap: 12px;
  padding: 16px;
}

.card {
  border: 1px solid #ddd;
  padding: 10px;
  border-radius: 8px;
}

.card img {
  width: 100%;
  height: 140px;
  object-fit: cover;
  background: #f2f2f2;
}

.hidden {
  display: none;
}
</style>

</head>

<body>

<header>
  <h1>Kay Notes Archive</h1>

  <input
    type="text"
    id="searchBox"
    placeholder="이름 / 별명 / 키워드 검색..."
  >
</header>

<div id="peopleContainer"></div>

<script src="people.js"></script>

<script>
/* =========================
   🔥 안전 렌더링 시스템
========================= */

const container = document.getElementById("peopleContainer");
const searchBox = document.getElementById("searchBox");

// people.js 로딩 체크
if (!Array.isArray(window.people)) {
  console.error("❌ people.js 로딩 실패 또는 데이터 깨짐");
  container.innerHTML = "<p>데이터를 불러올 수 없습니다.</p>";
} else {
  renderPeople(window.people);
}

// 렌더 함수
function renderPeople(list) {
  container.innerHTML = "";

  list.forEach(p => {
    const card = document.createElement("div");
    card.className = "card";

    card.innerHTML = `
      <img src="${p.image}" alt="${p.name}"
           onerror="this.src='images/placeholder.jpg'">
      <div class="name">${p.name}</div>
    `;

    container.appendChild(card);
  });
}

// 🔥 검색 기능 (안전 버전)
searchBox.addEventListener("input", (e) => {
  const keyword = e.target.value.toLowerCase();

  const filtered = window.people.filter(p =>
    (p.name || "").toLowerCase().includes(keyword) ||
    (p.desc || "").toLowerCase().includes(keyword) ||
    (p.meta || "").toLowerCase().includes(keyword)
  );

  renderPeople(filtered);
});
</script>

</body>
</html>
