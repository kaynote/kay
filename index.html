<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kay Notes Archive</title>

<link rel="stylesheet" href="style.css">

<style>
body {
  margin: 0;
  font-family: sans-serif;
}

header {
  padding: 12px 16px;
  border-bottom: 1px solid #ddd;
  position: sticky;
  top: 0;
  background: white;
  z-index: 10;
}

#searchBox {
  width: 100%;
  padding: 8px;
  margin-top: 8px;
}

#peopleContainer {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
  gap: 12px;
  padding: 16px;
  contain: layout paint;
}

.card {
  border: 1px solid #ddd;
  padding: 10px;
  border-radius: 8px;
  background: white;
  transition: transform 0.2s;
  min-height: 260px;
}

.card:hover {
  transform: translateY(-2px);
}

.card img {
  width: 100%;
  height: 140px;
  object-fit: cover;
  display: block;
  background: #f2f2f2;
  border-radius: 6px;
}

.name {
  margin-top: 6px;
  font-size: 14px;
  font-weight: bold;
}

.note {
  font-size: 12px;
  color: #666;
  margin-top: 4px;
  line-height: 1.4;
}

#errorBox {
  color: red;
  padding: 10px;
}
</style>
</head>

<body>

<header>
  <h1>Kay Notes Archive</h1>
  <input type="text" id="searchBox" placeholder="검색...">
</header>

<div id="errorBox"></div>
<div id="peopleContainer"></div>

<script type="module">
import people from "./people.js";

const container = document.getElementById("peopleContainer");
const searchBox = document.getElementById("searchBox");
const errorBox = document.getElementById("errorBox");

let data = [];

/* =========================
   초기화
========================= */
function init() {
  if (!Array.isArray(people)) {
    errorBox.innerText = "❌ people.js export 오류";
    return;
  }

  data = people;
  render(data);
}

/* =========================
   렌더 (DOM 1번만 갱신)
========================= */
function render(list) {
  container.innerHTML = list.map(p => `
    <div class="card">
      <img src="${p.image}" onerror="this.src='images/placeholder.jpg'">
      <div class="name">${p.name} / ${p.ko || ""}</div>
      <div class="note">${p.note || ""}</div>
    </div>
  `).join("");
}

/* =========================
   debounce (핵심 안정장치)
========================= */
function debounce(fn, delay = 200) {
  let t;
  return (...args) => {
    clearTimeout(t);
    t = setTimeout(() => fn(...args), delay);
  };
}

/* =========================
   검색
========================= */
const handleSearch = debounce((value) => {
  const k = value.toLowerCase();

  const filtered = data.filter(p =>
    (p.name || "").toLowerCase().includes(k) ||
    (p.ko || "").toLowerCase().includes(k) ||
    (p.note || "").toLowerCase().includes(k)
  );

  render(filtered);
}, 200);

searchBox.addEventListener("input", (e) => {
  handleSearch(e.target.value);
});

/* =========================
   실행
========================= */
init();

</script>

</body>
</html>
