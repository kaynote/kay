<script type="module">

import people from "./people.js?v=10";

import {
    db,
    auth,
    login,
    logout,
    watchAuth
} from "./firebase.js";

import {
    collection,
    getDocs,
    addDoc,
    query,
    orderBy,
    serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.0.0/firebase-firestore.js";

/* =========================
   DOM
========================= */

const container = document.getElementById("peopleContainer");
const modal = document.getElementById("modal");
const modalBody = document.getElementById("modalBody");
const closeModal = document.getElementById("closeModal");

const loginBtn = document.getElementById("loginBtn");
const logoutBtn = document.getElementById("logoutBtn");

/* =========================
   STATE
========================= */

let data = [];
let renderedMap = new Map();

/* =========================
   INIT
========================= */

function init(){
    if(!Array.isArray(people)) return;
    data = people;
    render(data);
}

/* =========================
   CARD
========================= */

function createCard(p, index){

    const card = document.createElement("div");
    card.className = "card";

    const img = document.createElement("img");
    img.src = p.image ? "images/" + p.image : "images/no-image.jpg";

    const photo = document.createElement("div");
    photo.className = "photo";
    photo.appendChild(img);

    const info = document.createElement("div");
    info.className = "info";

    const nameEl = document.createElement("div");
    nameEl.className = "name";

    const no = p.no || (index + 1);

    nameEl.innerHTML = `
        <span class="num">${no}.</span>
        <span class="txt">${p.name || ""}</span>
    `;

    info.appendChild(nameEl);
    card.appendChild(photo);
    card.appendChild(info);

    card.onclick = () => openModal(p);

    return card;
}

/* =========================
   RENDER
========================= */

function render(list){

    const fragment = document.createDocumentFragment();

    list.forEach((p, index)=>{

        const key = (p.no || index) + "_" + p.name;

        if(renderedMap.has(key)){
            fragment.appendChild(renderedMap.get(key));
        } else {
            const card = createCard(p, index);
            renderedMap.set(key, card);
            fragment.appendChild(card);
        }
    });

    container.replaceChildren(fragment);
}

/* =========================
   MODAL + COMMENTS
========================= */

async function openModal(p){

    modal.classList.remove("hidden");

    modalBody.innerHTML = `
        <img src="images/${p.image || 'no-image.jpg'}">

        <div class="modal-name">${p.displayName || p.name}</div>

        <div class="commentArea">
            <textarea class="commentInput" placeholder="댓글 입력"></textarea>
            <button class="commentBtn">등록</button>
            <div class="comments"></div>
        </div>
    `;

    const commentBtn = modalBody.querySelector(".commentBtn");
    const commentInput = modalBody.querySelector(".commentInput");
    const commentsDiv = modalBody.querySelector(".comments");

    if (!commentBtn || !commentInput || !commentsDiv) return;

    /* =========================
       댓글 작성
    ========================= */

    commentBtn.onclick = async () => {

        const text = commentInput.value.trim();
        if (!text) return;

        const user = auth.currentUser || await login();

        await addDoc(
            collection(db, "people", p.name, "comments"),
            {
                uid: user.uid,
                name: user.displayName || user.email || "익명",
                photo: user.photoURL,
                text,
                parentId: null,
                createdAt: serverTimestamp()
            }
        );

        commentInput.value = "";
        loadComments();
    };

    /* =========================
       댓글 로드 (유튜브 구조)
    ========================= */

    async function loadComments(){

        const q = query(
            collection(db, "people", p.name, "comments"),
            orderBy("createdAt", "desc")
        );

        const snap = await getDocs(q);

        const parents = [];
        const replies = [];

        snap.forEach(docSnap => {
            const c = docSnap.data();
            c.id = docSnap.id;

            if (!c.parentId) parents.push(c);
            else replies.push(c);
        });

        commentsDiv.innerHTML = "";

        parents.forEach(parent => {

            const div = document.createElement("div");
            div.className = "comment";

            div.innerHTML = `
                <div class="commentHeader">
                    <img src="${parent.photo || 'images/no-image.jpg'}">
                    <span class="commentName">${parent.name}</span>
                </div>

                <div class="commentText">${parent.text}</div>
            `;

            /* =========================
               답글 영역
            ========================= */

            const repliesWrap = document.createElement("div");
            repliesWrap.className = "replies";

            replies
                .filter(r => r.parentId === parent.id)
                .forEach(r => {

                    const rdiv = document.createElement("div");
                    rdiv.className = "reply";

                    rdiv.innerHTML = `
                        <span class="replyName">${r.name}</span>
                        <span class="replyText">${r.text}</span>
                    `;

                    repliesWrap.appendChild(rdiv);
                });

            /* =========================
               답글 버튼
            ========================= */

            const replyBtn = document.createElement("button");
            replyBtn.textContent = "답글";
            replyBtn.className = "replyBtn";

            replyBtn.onclick = async () => {

                const replyText = prompt("답글 입력");
                if (!replyText) return;

                const user = auth.currentUser || await login();

                await addDoc(
                    collection(db, "people", p.name, "comments"),
                    {
                        uid: user.uid,
                        name: user.displayName || user.email || "익명",
                        photo: user.photoURL,
                        text: replyText,
                        parentId: parent.id,
                        createdAt: serverTimestamp()
                    }
                );

                loadComments();
            };

            div.appendChild(replyBtn);
            div.appendChild(repliesWrap);

            commentsDiv.appendChild(div);
        });
    }

    await loadComments();
}

/* =========================
   AUTH (안전 버전)
========================= */

if (loginBtn) loginBtn.onclick = login;
if (logoutBtn) logoutBtn.onclick = logout;

watchAuth(user=>{
    const userInfo = document.getElementById("userInfo");
    if (userInfo) {
        userInfo.textContent = user ? user.email : "로그인 안 됨";
    }
});

/* =========================
   START
========================= */

init();

</script>
