<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>People Archive</title>

<style>
body {
    font-family: sans-serif;
    margin: 0;
    padding: 20px;
}

header {
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin-bottom: 20px;
}

#searchBox {
    padding: 10px;
    font-size: 14px;
    border: 1px solid #ccc;
    border-radius: 6px;
}

#peopleContainer {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 12px;
}

.card {
    border: 1px solid #ddd;
    border-radius: 10px;
    overflow: hidden;
    background: #fff;
}

.photo img {
    width: 100%;
    height: 180px;
    object-fit: cover;
    display: block;
}

.info {
    padding: 10px;
}

.name .en {
    font-weight: bold;
}

.meta {
    font-size: 12px;
    color: #666;
    margin-top: 4px;
}

.desc {
    font-size: 12px;
    margin-top: 6px;
    color: #333;
}
</style>
</head>

<body>

<header>
    <h1>People Archive</h1>
    <input id="searchBox" placeholder="검색..." />
</header>

<div id="peopleContainer"></div>

<script type="module">

import people from "./people.js";

/* =========================
   STATE
========================= */
let data = [];
let renderedMap = new Map();

/* =========================
   INIT
========================= */
function init(){

    const container = document.getElementById("peopleContainer");
    const searchBox = document.getElementById("searchBox");

    if(!container){
        console.warn("[WARN] peopleContainer not found");
        return;
    }

    if(!searchBox){
        console.warn("[WARN] searchBox not found");
    }

    if(!Array.isArray(people)) return;

    data = people;

    render(data, container);

    if(searchBox){
        searchBox.addEventListener("input", e => {
            handleSearch(e.target.value, container);
        });
    }
}

/* =========================
   CREATE CARD
========================= */
function createCard(p, index){

    const card = document.createElement("div");
    card.className = "card";

    const photo = document.createElement("div");
    photo.className = "photo";

    const img = document.createElement("img");

    img.src = p.image
        ? "images/" + p.image
        : "images/no-image.jpg";

    img.loading = "lazy";
    img.decoding = "async";

    photo.appendChild(img);

    const info = document.createElement("div");
    info.className = "info";

    const nameEl = document.createElement("div");
    nameEl.className = "name";

    const enEl = document.createElement("div");
    enEl.className = "en";

    const no = (p.no || (index + 1));

    enEl.innerHTML =
        `<span class="num">${no}.</span>
         <span class="txt">${p.name || ""}</span>`;

    const koEl = document.createElement("div");
    koEl.className = "ko";
    koEl.textContent = p.ko || "";

    nameEl.appendChild(enEl);

    if(p.ko){
        nameEl.appendChild(koEl);
    }

    const metaEl = document.createElement("div");
    metaEl.className = "meta";
    metaEl.textContent = p.tags ? p.tags.join(" · ") : "";

    const descEl = document.createElement("div");
    descEl.className = "desc";
    descEl.innerHTML = p.note || "";

    info.appendChild(nameEl);
    info.appendChild(metaEl);
    info.appendChild(descEl);

    card.appendChild(photo);
    card.appendChild(info);

    return card;
}

/* =========================
   RENDER
========================= */
function render(list, container){

    if(!container) return;

    const fragment = document.createDocumentFragment();

    list.forEach((p, index) => {

        const key = `${p.no || index}_${p.name}`;

        if(renderedMap.has(key)){
            fragment.appendChild(renderedMap.get(key));
        } else {
            const card = createCard(p, index);
            renderedMap.set(key, card);
            fragment.appendChild(card);
        }

    });

    container.replaceChildren(fragment);
}

/* =========================
   SEARCH
========================= */
function debounce(fn, delay = 150){
    let t;
    return (...args) => {
        clearTimeout(t);
        t = setTimeout(() => fn(...args), delay);
    };
}

const handleSearch = debounce((value, container) => {

    const k = value.toLowerCase();

    const filtered = data.filter(p =>
        (p.name || "").toLowerCase().includes(k) ||
        (p.ko || "").toLowerCase().includes(k) ||
        (p.note || "").toLowerCase().includes(k)
    );

    render(filtered, container);

}, 150);

/* =========================
   START
========================= */
window.addEventListener("DOMContentLoaded", init);

</script>

</body>
</html>
