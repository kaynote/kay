<!DOCTYPE html>
<html lang="ko">

<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Kay Notes Archive</title>

<link rel="stylesheet" href="style.css?v=10">

<style>
#peopleContainer{
    contain:layout paint;
}
</style>

</head>

<body>

<header>
    <h1>Kay Notes Archive</h1>

    <div id="userInfo">로그인 안 됨</div>

    <div class="authArea">
        <button id="loginBtn">로그인</button>
        <button id="logoutBtn">로그아웃</button>
    </div>

    <input type="text" id="searchBox" placeholder="검색...">
</header>

<div id="peopleContainer"></div>

<!-- MODAL -->
<div id="modal" class="modal hidden">
    <div class="modal-content">
        <button id="closeModal" class="closeBtn">✕</button>
        <div id="modalBody"></div>
    </div>
</div>

<script type="module">

import people from "./people.js?v=10";

import {
    db,
    auth,
    login,
    logout,
    watchAuth
} from "./firebase.js";

import {
    collection,
    getDocs,
    addDoc,
    deleteDoc,
    doc,
    setDoc,
    getDoc,
    updateDoc,
    query,
    orderBy
} from "https://www.gstatic.com/firebasejs/12.0.0/firebase-firestore.js";

/* =========================
   CONFIG
========================= */

const ADMIN_EMAIL = "ektjttnfp5@gmail.com";

/* =========================
   DOM
========================= */

const container = document.getElementById("peopleContainer");
const searchBox = document.getElementById("searchBox");
const modal = document.getElementById("modal");
const modalBody = document.getElementById("modalBody");
const closeModal = document.getElementById("closeModal");

const loginBtn = document.getElementById("loginBtn");
const logoutBtn = document.getElementById("logoutBtn");

/* =========================
   STATE
========================= */

async function isBanned(uid){

    const snap = await getDoc(
        doc(db, "bannedUsers", uid)
    );

    return snap.exists();
}

let data = [];
let renderedMap = new Map();

/* =========================
   INIT
========================= */

function init(){
    if(!Array.isArray(people)) return;
    data = people;
    render(data);
}

/* =========================
   CARD
========================= */

function createCard(p, index){

    const card = document.createElement("div");
    card.className = "card";

    const img = document.createElement("img");
    img.src = p.image ? "images/" + p.image : "images/no-image.jpg";
    img.loading = "lazy";
    img.decoding = "async";

    const photo = document.createElement("div");
    photo.className = "photo";
    photo.appendChild(img);

    const info = document.createElement("div");
    info.className = "info";

    const nameEl = document.createElement("div");
    nameEl.className = "name";

    const enEl = document.createElement("div");
    enEl.className = "en";

    const no = p.no || (index + 1);

    enEl.innerHTML = `
        <span class="num">${no}.</span>
        <span class="txt">${p.name || ""}</span>
    `;

    nameEl.appendChild(enEl);

    if(p.ko){
        const koEl = document.createElement("div");
        koEl.className = "ko";
        koEl.textContent = p.ko;
        nameEl.appendChild(koEl);
    }

    const metaEl = document.createElement("div");
    metaEl.className = "meta";
    metaEl.textContent = p.tags ? p.tags.join(" · ") : "";

    const descEl = document.createElement("div");
    descEl.className = "desc";
    descEl.innerHTML = p.note || "";

    info.appendChild(nameEl);
    info.appendChild(metaEl);
    info.appendChild(descEl);

    card.appendChild(photo);
    card.appendChild(info);

    card.addEventListener("click", () => openModal(p));

    return card;
}

/* =========================
   RENDER
========================= */

function render(list){

    const fragment = document.createDocumentFragment();

    list.forEach((p, index)=>{

        const key = (p.no || index) + "_" + p.name;

        if(renderedMap.has(key)){
            fragment.appendChild(renderedMap.get(key));
        } else {
            const card = createCard(p, index);
            renderedMap.set(key, card);
            fragment.appendChild(card);
        }
    });

    container.replaceChildren(fragment);
}

/* =========================
   SEARCH
========================= */

function debounce(fn, delay = 150){
    let t;
    return (...args)=>{
        clearTimeout(t);
        t = setTimeout(()=>fn(...args), delay);
    };
}

const handleSearch = debounce(value=>{
    const k = value.toLowerCase();

    const filtered = data.filter(p =>
        (p.name || "").toLowerCase().includes(k) ||
        (p.ko || "").toLowerCase().includes(k) ||
        (p.note || "").toLowerCase().includes(k)
    );

    render(filtered);
});

searchBox.addEventListener("input", e=>{
    handleSearch(e.target.value);
});

/* =========================
   MODAL
========================= */

async function openModal(p){

    modal.classList.remove("hidden");

    modalBody.innerHTML = `
        <img class="modal-photo" src="images/${p.image || 'no-image.jpg'}">

        <div class="modal-name">${p.displayName || p.name}</div>
        <div class="modal-desc">${p.note || ""}</div>

        <div class="likeArea">
            <button class="likeBtn">👍 좋아요</button>
            <span class="likeCount">0</span>
            <button class="showLikesBtn" style="display:none;">추천자 보기</button>
        </div>

        <div class="commentArea">
            <textarea class="commentInput" placeholder="댓글 입력 (최대 1000자)"></textarea>
            <button class="commentBtn">등록</button>
            <div class="comments"></div>
        </div>
    `;

    const likeBtn = modalBody.querySelector(".likeBtn");
    const likeCountEl = modalBody.querySelector(".likeCount");
    const showLikesBtn = modalBody.querySelector(".showLikesBtn");

    /* 🔥 여기 */
    if(auth.currentUser?.email === ADMIN_EMAIL){
        showLikesBtn.style.display = "inline-block";
    } else {
        showLikesBtn.style.display = "none";
    }

    const commentBtn = modalBody.querySelector(".commentBtn");
    const commentInput = modalBody.querySelector(".commentInput");
    const commentsDiv = modalBody.querySelector(".comments");

    /* =====================
       SHOW LIKES (한 번만 등록)
    ===================== */

    showLikesBtn.addEventListener("click", async ()=>{
        const snap = await getDocs(
            collection(db, "people", p.name, "likes")
        );

        const result = snap.docs
            .map(d => d.data().name || "이름 없음")
            .join("\n");

        alert(result || "추천 없음");
    });

    /* =====================
       LOAD LIKES
    ===================== */

    async function loadLikes(){
        const snap = await getDocs(
            collection(db, "people", p.name, "likes")
        );

        likeCountEl.textContent = snap.size;
    }

    /* =====================
       LIKE TOGGLE
    ===================== */

    likeBtn.addEventListener("click", async ()=>{

        const user = auth.currentUser || await login();
        
        if(await isBanned(user.uid)){
            alert("차단된 계정입니다.");
            return;
        }

        const ref = doc(db, "people", p.name, "likes", user.uid);

        const liked = await getDoc(ref);

        if(liked.exists()){
            await deleteDoc(ref);
        } else {
            await setDoc(ref, {
                uid: user.uid,
                name:
                  user.providerData?.[0]?.displayName ||
                  user.displayName ||
                  user.email ||
                  "익명",
                photo: user.photoURL,
                createdAt: Date.now()
            });
        }

        if(auth.currentUser?.email === ADMIN_EMAIL){
            showLikesBtn.style.display = "inline-block";
        }

        loadLikes();
    });

    /* =====================
       COMMENTS
    ===================== */

    commentBtn.addEventListener("click", async ()=>{

        const text = commentInput.value.trim();
        if(!text) return;

        if(text.length > 1000){
            alert("댓글은 1000자 이하만 가능합니다.");
            return;
        }

        const user = auth.currentUser || await login();
        
        if(await isBanned(user.uid)){
            alert("차단된 계정입니다.");
            return;
        }

        await addDoc(
            collection(db, "people", p.name, "comments"),
            {
                uid: user.uid,
                name:
                  user.providerData?.[0]?.displayName ||
                  user.displayName ||
                  user.email ||
                  "익명",
                photo: user.photoURL,
                text,
                createdAt: Date.now()
            }
        );

        commentInput.value = "";
        loadComments();
    });

    /* =====================
       LOAD COMMENTS
    ===================== */

    async function loadComments(){

        const q = query(
            collection(db, "people", p.name, "comments"),
            orderBy("createdAt", "desc")
        );

        const snap = await getDocs(q);

        commentsDiv.innerHTML = "";

        snap.forEach(docSnap=>{
            const c = docSnap.data();

            const div = document.createElement("div");
            div.className = "comment";

            div.innerHTML = `
                <div class="commentHeader">
                    <img src="${c.photo || 'images/no-image.jpg'}">
                    <span class="commentName">${c.name}</span>
                </div>

                <div class="commentText">${c.text}</div>

                ${c.editedAt ? '<div class="edited">(수정됨)</div>' : ''}
            `;

            if(
                auth.currentUser &&
                (c.uid === auth.currentUser.uid ||
                 auth.currentUser.email === ADMIN_EMAIL)
            ){

                const editBtn = document.createElement("button");
                editBtn.textContent = "수정";

                editBtn.onclick = async ()=>{
                    const newText = prompt("댓글 수정", c.text);
                    if(!newText) return;

                    await updateDoc(
                        doc(db, "people", p.name, "comments", docSnap.id),
                        {
                            text: newText.trim(),
                            editedAt: Date.now()
                        }
                    );

                    loadComments();
                };

                const delBtn = document.createElement("button");
                delBtn.textContent = "삭제";

                delBtn.onclick = async ()=>{
                    if(!confirm("삭제할까요?")) return;

                    await deleteDoc(
                        doc(db, "people", p.name, "comments", docSnap.id)
                    );

                    loadComments();
                };

                div.appendChild(editBtn);
                div.appendChild(delBtn);
            }

            commentsDiv.appendChild(div);
        });
    }

    await loadLikes();
    await loadComments();
}

/* =========================
   CLOSE MODAL
========================= */

closeModal.addEventListener("click", ()=>{
    modal.classList.add("hidden");
});

modal.addEventListener("click", e=>{
    if(e.target === modal){
        modal.classList.add("hidden");
    }
});

/* =========================
   AUTH
========================= */

loginBtn.addEventListener("click", login);
logoutBtn.addEventListener("click", logout);

watchAuth(user=>{

    const userInfo = document.getElementById("userInfo");

    if(!user){

        userInfo.textContent = "로그인 안 됨";

        loginBtn.style.display = "inline-block";
        logoutBtn.style.display = "none";

        searchBox.style.display = "none";

        container.innerHTML = `
            <div style="
                text-align:center;
                padding:60px 20px;
                font-size:20px;
            ">
                🔒 Google 로그인 후 이용 가능합니다.
            </div>
        `;

        return;
    }

    userInfo.textContent =
      user.email + " | UID: " + user.uid;

    loginBtn.style.display = "none";
    logoutBtn.style.display = "inline-block";

    searchBox.style.display = "block";

    const banned = await isBanned(user.uid);

    if(banned){

        container.innerHTML = `
          <div style="
            text-align:center;
            padding:80px;
            font-size:22px;
          ">
            접근 권한이 없습니다.
          </div>
        `;

        return;
    }

    render(data);
});

/* =========================
   START
========================= */

data = people;

</script>

</body>
</html>
