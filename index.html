<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kay Notes Archive</title>

<link rel="stylesheet" href="style.css">

<style>
#peopleContainer {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
  gap: 12px;
  padding: 16px;
}

.card {
  border: 1px solid #ddd;
  padding: 10px;
  border-radius: 8px;
  background: white;
}

.card img {
  width: 100%;
  height: 140px;
  object-fit: cover;
  background: #f2f2f2;
}

.name {
  margin-top: 6px;
  font-size: 14px;
}

#errorBox {
  color: red;
  padding: 10px;
}
</style>
</head>

<body>

<header>
  <h1>Kay Notes Archive</h1>
  <input type="text" id="searchBox" placeholder="검색..." disabled>
</header>

<div id="errorBox"></div>
<div id="peopleContainer"></div>

<!-- 핵심: 상대경로 + defer -->
<script src="./people.js" defer></script>

<script>
const container = document.getElementById("peopleContainer");
const searchBox = document.getElementById("searchBox");
const errorBox = document.getElementById("errorBox");

let data = [];

/* =========================
   안전 초기화
========================= */
function init() {

  if (!window.people) {
    errorBox.innerText =
      "❌ people.js는 로딩됐지만 window.people이 없습니다. (export 확인 필요)";
    return;
  }

  data = Array.isArray(window.people) ? window.people : [];

  searchBox.disabled = false;
  render(data);
}

/* =========================
   렌더
========================= */
function render(list) {
  container.innerHTML = "";

  list.forEach(p => {
    const card = document.createElement("div");
    card.className = "card";

    card.innerHTML = `
      <img src="${p.image}" onerror="this.src='images/placeholder.jpg'">
      <div class="name">${p.name}</div>
    `;

    container.appendChild(card);
  });
}

/* =========================
   검색
========================= */
searchBox.addEventListener("input", (e) => {
  const k = e.target.value.toLowerCase();

  const filtered = data.filter(p =>
    (p.name || "").toLowerCase().includes(k) ||
    (p.ko || "").toLowerCase().includes(k) ||
    (p.note || "").toLowerCase().includes(k)
  );

  render(filtered);
});

/* =========================
   로딩 보장 (핵심)
========================= */
window.addEventListener("load", () => {
  init();
});
</script>

</body>
</html>
