<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kay Notes Archive</title>

<link rel="stylesheet" href="style.css">

<style>
#peopleContainer {
  contain: layout paint;
}
</style>

</head>

<body>

<header>
  <h1>Kay Notes Archive</h1>
  <input type="text" id="searchBox" placeholder="검색...">
</header>

<div id="peopleContainer"></div>

<script type="module">
import people from "./people.js";

const container = document.getElementById("peopleContainer");
const searchBox = document.getElementById("searchBox");

let data = [];
let renderedMap = new Map(); // 🔥 핵심: DOM 재사용용

/* =========================
   INIT
========================= */
function init() {
  if (!Array.isArray(people)) return;

  data = people;
  render(data);
}

/* =========================
   CREATE CARD (한 번만 생성)
========================= */
function createCard(p) {
  const card = document.createElement("div");
  card.className = "card";

  const photo = document.createElement("div");
  photo.className = "photo";

  const img = document.createElement("img");
  img.src = p.image ? "images/" + p.image : "images/no-image.jpg";
  img.loading = "eager"; // 🔥 lazy 제거 (깜빡임 방지)
  img.decoding = "async";

  photo.appendChild(img);

  const info = document.createElement("div");
  info.className = "info";

  info.innerHTML = `
    <div class="name">${p.name} / ${p.ko || ""}</div>
    <div class="meta">${p.tags ? p.tags.join(" · ") : ""}</div>
    <div class="desc">${p.note || ""}</div>
  `;

  card.appendChild(photo);
  card.appendChild(info);

  return card;
}

/* =========================
   RENDER (🔥 DOM 재사용 핵심)
========================= */
function render(list) {

  const fragment = document.createDocumentFragment();

  list.forEach(p => {

    // 기존 DOM 있으면 재사용
    if (renderedMap.has(p.name)) {
      fragment.appendChild(renderedMap.get(p.name));
    } else {
      const card = createCard(p);
      renderedMap.set(p.name, card);
      fragment.appendChild(card);
    }

  });

  container.replaceChildren(fragment);
}

/* =========================
   SEARCH (debounce)
========================= */
function debounce(fn, delay = 150) {
  let t;
  return (...args) => {
    clearTimeout(t);
    t = setTimeout(() => fn(...args), delay);
  };
}

const handleSearch = debounce((value) => {
  const k = value.toLowerCase();

  const filtered = data.filter(p =>
    (p.name || "").toLowerCase().includes(k) ||
    (p.ko || "").toLowerCase().includes(k) ||
    (p.note || "").toLowerCase().includes(k)
  );

  render(filtered);
}, 150);

searchBox.addEventListener("input", e => {
  handleSearch(e.target.value);
});

/* =========================
   START
========================= */
init();

</script>

</body>
</html>
