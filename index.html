<script type="module">

import people from "./people.js";

document.addEventListener("DOMContentLoaded", () => {

    const container = document.getElementById("peopleContainer");
    const searchBox = document.getElementById("searchBox");

    /* =========================
       🔥 DOM 체크 (필수)
    ========================= */
    if (!container) {
        console.error("❌ peopleContainer 없음 (HTML 확인 필요)");
        return;
    }

    if (!searchBox) {
        console.error("❌ searchBox 없음 (HTML 확인 필요)");
        return;
    }

    /* =========================
       🔥 데이터
    ========================= */
    let data = [];
    let renderedMap = new Map();

    function init() {
        if (!Array.isArray(people)) {
            console.error("❌ people 데이터가 배열이 아님");
            return;
        }

        data = people;
        render(data);
    }

    /* =========================
       🔥 카드 생성
    ========================= */
    function createCard(p, index) {

        const card = document.createElement("div");
        card.className = "card";

        const photo = document.createElement("div");
        photo.className = "photo";

        const img = document.createElement("img");

        img.src = p?.image
            ? "images/" + p.image
            : "images/no-image.jpg";

        img.loading = "lazy";

        photo.appendChild(img);

        const info = document.createElement("div");
        info.className = "info";

        const nameEl = document.createElement("div");
        nameEl.className = "name";

        const no = p?.no ?? (index + 1);

        nameEl.innerHTML = `
            <div class="en">
                <span class="num">${no}.</span>
                <span class="txt">${p?.name ?? ""}</span>
            </div>
        `;

        const koEl = document.createElement("div");
        koEl.className = "ko";
        koEl.textContent = p?.ko ?? "";

        if (p?.ko) nameEl.appendChild(koEl);

        const descEl = document.createElement("div");
        descEl.className = "desc";
        descEl.textContent = p?.note ?? "";

        /* =========================
           TIMELINE
        ========================= */
        const timelineEl = document.createElement("div");
        timelineEl.className = "timeline";

        if (Array.isArray(p?.timeline)) {
            p.timeline.forEach(t => {

                const item = document.createElement("div");

                const type = t?.type ?? "text";
                const text = t?.text ?? "";

                item.className = type;
                item.textContent = text;

                timelineEl.appendChild(item);
            });
        }

        info.appendChild(nameEl);
        info.appendChild(descEl);

        if (p?.timeline?.length) {
            info.appendChild(timelineEl);
        }

        card.appendChild(photo);
        card.appendChild(info);

        return card;
    }

    /* =========================
       🔥 렌더링
    ========================= */
    function render(list) {

        const fragment = document.createDocumentFragment();

        list.forEach((p, index) => {

            const key = `${p?.no ?? index}_${p?.name ?? ""}`;

            if (renderedMap.has(key)) {
                fragment.appendChild(renderedMap.get(key));
            } else {
                const card = createCard(p, index);
                renderedMap.set(key, card);
                fragment.appendChild(card);
            }
        });

        container.replaceChildren(fragment);
    }

    /* =========================
       🔥 debounce
    ========================= */
    function debounce(fn, delay = 150) {
        let t;

        return (...args) => {
            clearTimeout(t);
            t = setTimeout(() => fn(...args), delay);
        };
    }

    /* =========================
       🔥 검색
    ========================= */
    const handleSearch = debounce((value) => {

        const k = (value || "").toLowerCase();

        const filtered = data.filter(p =>
            (p?.name ?? "").toLowerCase().includes(k) ||
            (p?.ko ?? "").toLowerCase().includes(k) ||
            (p?.note ?? "").toLowerCase().includes(k)
        );

        render(filtered);

    }, 150);

    searchBox.addEventListener("input", (e) => {
        handleSearch(e.target.value);
    });

    /* =========================
       🔥 시작
    ========================= */
    init();

});

</script>
