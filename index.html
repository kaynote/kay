<script type="module">

import people from "./people.js?v=10";

import {
    db,
    auth,
    login,
    logout,
    watchAuth
} from "./firebase.js";

import {
    collection,
    getDocs,
    addDoc,
    deleteDoc,
    doc,
    setDoc,
    getDoc,
    updateDoc,
    query,
    orderBy
} from "https://www.gstatic.com/firebasejs/12.0.0/firebase-firestore.js";

/* =========================
   CONFIG
========================= */

const ADMIN_EMAIL = "ektjttnfp5@gmail.com";

/* =========================
   STATE
========================= */

let data = [];
let renderedMap = new Map();

/* =========================
   DOM
========================= */

const container = document.getElementById("peopleContainer");
const searchBox = document.getElementById("searchBox");
const modal = document.getElementById("modal");
const modalBody = document.getElementById("modalBody");
const closeModal = document.getElementById("closeModal");

const loginBtn = document.getElementById("loginBtn");
const logoutBtn = document.getElementById("logoutBtn");
const closeModal = document.getElementById("closeModal");

if(loginBtn) loginBtn.addEventListener("click", login);
if(logoutBtn) logoutBtn.addEventListener("click", logout);
if(closeModal) closeModal.addEventListener("click", () => {
    modal.classList.add("hidden");
});

/* =========================
   INIT
========================= */

function init(){
    if(!Array.isArray(people)) return;
    data = people;
    render(data);
}

/* =========================
   CARD
========================= */

function createCard(p, index){

    const card = document.createElement("div");
    card.className = "card";

    const img = document.createElement("img");
    img.src = p.image ? "images/" + p.image : "images/no-image.jpg";
    img.loading = "lazy";
    img.decoding = "async";

    const photo = document.createElement("div");
    photo.className = "photo";
    photo.appendChild(img);

    const info = document.createElement("div");
    info.className = "info";

    const nameEl = document.createElement("div");
    nameEl.className = "name";

    const enEl = document.createElement("div");
    enEl.className = "en";

    const no = p.no || (index + 1);

    enEl.innerHTML = `
        <span class="num">${no}.</span>
        <span class="txt">${p.name || ""}</span>
    `;

    nameEl.appendChild(enEl);

    if(p.ko){
        const koEl = document.createElement("div");
        koEl.className = "ko";
        koEl.textContent = p.ko;
        nameEl.appendChild(koEl);
    }

    const metaEl = document.createElement("div");
    metaEl.className = "meta";
    metaEl.textContent = p.tags ? p.tags.join(" · ") : "";

    const descEl = document.createElement("div");
    descEl.className = "desc";
    descEl.innerHTML = p.note || "";

    info.appendChild(nameEl);
    info.appendChild(metaEl);
    info.appendChild(descEl);

    card.appendChild(photo);
    card.appendChild(info);

    card.addEventListener("click", () => openModal(p));

    return card;
}

/* =========================
   RENDER
========================= */

function render(list){

    const fragment = document.createDocumentFragment();

    list.forEach((p, index)=>{

        const key = (p.no || index) + "_" + p.name;

        if(renderedMap.has(key)){
            fragment.appendChild(renderedMap.get(key));
        } else {
            const card = createCard(p, index);
            renderedMap.set(key, card);
            fragment.appendChild(card);
        }
    });

    container.replaceChildren(fragment);
}

/* =========================
   SEARCH
========================= */

function debounce(fn, delay = 150){
    let t;
    return (...args)=>{
        clearTimeout(t);
        t = setTimeout(()=>fn(...args), delay);
    };
}

const handleSearch = debounce(value=>{
    const k = value.toLowerCase();

    const filtered = data.filter(p =>
        (p.name || "").toLowerCase().includes(k) ||
        (p.ko || "").toLowerCase().includes(k) ||
        (p.note || "").toLowerCase().includes(k)
    );

    render(filtered);
});

searchBox.addEventListener("input", e=>{
    handleSearch(e.target.value);
});

/* =========================
   MODAL STATE
========================= */

let currentPerson = null;

/* =========================
   MODAL
========================= */

async function openModal(p){

    currentPerson = p;

    modal.classList.remove("hidden");

    modalBody.innerHTML = `
        <img class="modal-photo" src="images/${p.image || 'no-image.jpg'}">

        <div class="modal-name">${p.displayName || p.name}</div>
        <div class="modal-desc">${p.note || ""}</div>

        <div class="likeArea">
            <button class="likeBtn">👍 좋아요</button>
            <span class="likeCount">0</span>
            <button class="showLikesBtn" style="display:none;">추천자 보기</button>
        </div>

        <div class="commentArea">
            <textarea class="commentInput" placeholder="댓글 입력 (최대 1000자)"></textarea>
            <button class="commentBtn">등록</button>
            <div class="comments"></div>
        </div>
    `;

    const likeBtn = modalBody.querySelector(".likeBtn");
    const likeCountEl = modalBody.querySelector(".likeCount");
    const showLikesBtn = modalBody.querySelector(".showLikesBtn");

    const commentBtn = modalBody.querySelector(".commentBtn");
    const commentInput = modalBody.querySelector(".commentInput");
    const commentsDiv = modalBody.querySelector(".comments");

    /* =========================
       ADMIN UI (정상 위치)
    ========================= */

    function setAdminUI(){
        const user = auth.currentUser;

        showLikesBtn.style.display =
            (user && user.email === ADMIN_EMAIL)
            ? "inline-block"
            : "none";
    }

    setAdminUI();

    /* =========================
       SHOW LIKES (중복 제거)
    ========================= */

    showLikesBtn.onclick = async () => {

        const snap = await getDocs(
            collection(db, "people", p.name, "likes")
        );

        const list = [...new Set(
            snap.docs.map(d =>
                d.data().name || d.data().email || "익명"
            )
        )];

        alert(list.length ? list.join("\n") : "추천 없음");
    };

    /* =========================
       LOAD LIKES
    ========================= */

    async function loadLikes(){

        const snap = await getDocs(
            collection(db, "people", p.name, "likes")
        );

        likeCountEl.textContent = snap.size;
    }

    /* =========================
       LIKE TOGGLE
    ========================= */

    likeBtn.onclick = async () => {

        const user = auth.currentUser || await login();

        const ref = doc(db, "people", p.name, "likes", user.uid);

        const liked = await getDoc(ref);

        if(liked.exists()){
            await deleteDoc(ref);
        } else {
            await setDoc(ref, {
                uid: user.uid,
                name: user.displayName || user.email || "익명",
                email: user.email || "",
                createdAt: Date.now()
            });
        }

        loadLikes();
        setAdminUI();
    };

    /* =========================
       COMMENTS
    ========================= */

    commentBtn.onclick = async () => {

        const text = commentInput.value.trim();
        if(!text) return;

        if(text.length > 1000){
            alert("댓글은 1000자 이하만 가능합니다.");
            return;
        }

        const user = auth.currentUser || await login();

        await addDoc(collection(db, "people", p.name, "comments"), {
            uid: user.uid,
            name: user.displayName || user.email || "익명",
            photo: user.photoURL || "",
            text,
            createdAt: Date.now()
        });

        commentInput.value = "";
        loadComments();
    };

    /* =========================
       LOAD COMMENTS
    ========================= */

    async function loadComments(){

        const q = query(
            collection(db, "people", p.name, "comments"),
            orderBy("createdAt", "desc")
        );

        const snap = await getDocs(q);

        commentsDiv.innerHTML = "";

        snap.forEach(docSnap=>{
            const c = docSnap.data();

            const div = document.createElement("div");
            div.className = "comment";

            div.innerHTML = `
                <div class="commentHeader">
                    <img src="${c.photo || 'images/no-image.jpg'}">
                    <span class="commentName">${c.name}</span>
                </div>

                <div class="commentText">${c.text}</div>
            `;

            commentsDiv.appendChild(div);
        });
    }

    loadLikes();
    loadComments();
}

/* =========================
   CLOSE MODAL
========================= */

closeModal.onclick = () => {
    modal.classList.add("hidden");
};

modal.onclick = (e) => {
    if(e.target === modal){
        modal.classList.add("hidden");
    }
};

/* =========================
   AUTH
========================= */

loginBtn.onclick = login;
logoutBtn.onclick = logout;

watchAuth(user => {

    const userInfo = document.getElementById("userInfo");

    if(!user){
        userInfo.textContent = "로그인 안 됨";
        loginBtn.style.display = "inline-block";
        logoutBtn.style.display = "none";
        return;
    }

    userInfo.textContent = user.email;
    loginBtn.style.display = "none";
    logoutBtn.style.display = "inline-block";
});

/* =========================
   START
========================= */

init();

</script>
