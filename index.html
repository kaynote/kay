/* =========================

const container = document.getElementById("peopleContainer");

const logoutBtn = document.getElementById("logoutBtn");

/* =========================
   STATE
========================= */

let data = [];
let renderedMap = new Map();

/* =========================
   INIT
========================= */

function init(){
    if(!Array.isArray(people)) return;
    data = people;
    render(data);
}

/* =========================
   CARD
========================= */

function createCard(p, index){

    const card = document.createElement("div");
    card.className = "card";

    const img = document.createElement("img");
    img.src = p.image ? "images/" + p.image : "images/no-image.jpg";
    img.loading = "lazy";
    img.decoding = "async";

    const photo = document.createElement("div");
    photo.className = "photo";
    photo.appendChild(img);

    const info = document.createElement("div");
    info.className = "info";

    const nameEl = document.createElement("div");
    nameEl.className = "name";

    const enEl = document.createElement("div");
    enEl.className = "en";

    const no = p.no || (index + 1);

    enEl.innerHTML = `
        <span class="num">${no}.</span>
        <span class="txt">${p.name || ""}</span>
    `;

    nameEl.appendChild(enEl);

    if(p.ko){
        const koEl = document.createElement("div");
        koEl.className = "ko";
        koEl.textContent = p.ko;
        nameEl.appendChild(koEl);
    }

    const metaEl = document.createElement("div");
    metaEl.className = "meta";
    metaEl.textContent = p.tags ? p.tags.join(" · ") : "";

    const descEl = document.createElement("div");
    descEl.className = "desc";
    descEl.innerHTML = p.note || "";

    info.appendChild(nameEl);
    info.appendChild(metaEl);
    info.appendChild(descEl);

    card.appendChild(photo);
    card.appendChild(info);

    card.addEventListener("click", () => openModal(p));

    return card;
}

/* =========================
   RENDER
========================= */

function render(list){

    const fragment = document.createDocumentFragment();

    list.forEach((p, index)=>{

        const key = (p.no || index) + "_" + p.name;

        if(renderedMap.has(key)){
            fragment.appendChild(renderedMap.get(key));
        } else {
            const card = createCard(p, index);
            renderedMap.set(key, card);
            fragment.appendChild(card);
        }
    });

    container.replaceChildren(fragment);
}

/* =========================
   SEARCH
========================= */

function debounce(fn, delay = 150){
    let t;
    return (...args)=>{
        clearTimeout(t);
        t = setTimeout(()=>fn(...args), delay);
    };
}

const handleSearch = debounce(value=>{
    const k = value.toLowerCase();

    const filtered = data.filter(p =>
        (p.name || "").toLowerCase().includes(k) ||
        (p.ko || "").toLowerCase().includes(k) ||
        (p.note || "").toLowerCase().includes(k)
    );

    render(filtered);
});

searchBox.addEventListener("input", e=>{
    handleSearch(e.target.value);
});

/* =========================
   MODAL
========================= */

function formatDate(ts){
    if(!ts) return "";

    const d = ts.toDate();

    const yyyy = d.getFullYear();
    const mm = String(d.getMonth()+1).padStart(2,"0");
    const dd = String(d.getDate()).padStart(2,"0");

    const hh = String(d.getHours()).padStart(2,"0");
    const mi = String(d.getMinutes()).padStart(2,"0");
    const ss = String(d.getSeconds()).padStart(2,"0");

    return `${yyyy}-${mm}-${dd} ${hh}:${mi}:${ss}`;
}
            
async function openModal(p){

    modal.classList.remove("hidden");

    modalBody.innerHTML = `
        <img class="modal-photo" src="images/${p.image || 'no-image.jpg'}">

        <div class="modal-name">${p.displayName || p.name}</div>
        <div class="modal-desc">${p.note || ""}</div>

        <div class="likeArea">
            <button class="likeBtn">👍 좋아요</button>
            <span class="likeCount">0</span>

            <span class="commentLabel">💬 댓글</span>
            <span class="commentCount">0</span>

            <button class="showLikesBtn" style="display:none;">추천자 보기</button>
        </div>

        <div class="commentArea">
            <textarea class="commentInput" placeholder="댓글 입력 (최대 1000자)"></textarea>
            <button class="commentBtn">등록</button>
            <div class="comments"></div>
        </div>
    `;

    const likeBtn = modalBody.querySelector(".likeBtn");
    const likeCountEl = modalBody.querySelector(".likeCount");
    const commentCountEl = modalBody.querySelector(".commentCount");
    const showLikesBtn = modalBody.querySelector(".showLikesBtn");

    /* 🔥 여기 */
    if(auth.currentUser?.email === ADMIN_EMAIL){
        showLikesBtn.style.display = "inline-block";
    } else {
        showLikesBtn.style.display = "none";
    }

    const commentBtn = modalBody.querySelector(".commentBtn");
    const commentInput = modalBody.querySelector(".commentInput");
    const commentsDiv = modalBody.querySelector(".comments");
    
    let replyTarget = null;

    /* =====================
       SHOW LIKES (한 번만 등록)
    ===================== */

    showLikesBtn.addEventListener("click", async ()=>{
        const snap = await getDocs(
            collection(db, "people", p.id, "likes")
        );

        const result = snap.docs
            .map(d => d.data().name || "이름 없음")
            .join("\n");

        alert(result || "추천 없음");
    });

    /* =====================
       LOAD LIKES
    ===================== */

    async function loadLikes(){
        const snap = await getDocs(
            collection(db, "people", p.id, "likes")
        );

        likeCountEl.textContent = snap.size;
    }

    /* =====================
       LIKE TOGGLE
    ===================== */

    likeBtn.addEventListener("click", async ()=>{

        let user = auth.currentUser;

        if (!user) {
            await login();
            user = auth.currentUser;
        }

        const ref = doc(db, "people", p.id, "likes", user.uid);

        const liked = await getDoc(ref);

        if(liked.exists()){
            await deleteDoc(ref);
        } else {
            await setDoc(ref, {
                uid: user.uid,
                name:
                  user.providerData?.[0]?.displayName ||
                  user.displayName ||
                  user.email ||
                  "익명",
                photo: user.photoURL,
                createdAt: Date.now()
            });
        }

        if(auth.currentUser?.email === ADMIN_EMAIL){
            showLikesBtn.style.display = "inline-block";
        }

        loadLikes();
    });

    /* =====================
       COMMENTS
    ===================== */

    commentBtn.addEventListener("click", async () => {
        try {

            const text = commentInput.value.trim();
            if (!text) return;

            const user = auth.currentUser || await login();

            console.log("1. 댓글 저장 시작");

            const commentRef = await addDoc(
              collection(db, "people", p.id, "comments"),
              {
                uid: user.uid,
                text,
                parentId: null,
                postId: p.id,
                createdAt: serverTimestamp()
              }
            );

            console.log("2. 댓글 저장 완료");

            console.log({
                targetUid: ADMIN_UID,
                senderUid: user.uid,
                senderName: user.displayName,
                postId: p.id,
                commentId: commentRef.id,
                type: "comment",
                read: false
            });

            if (user.uid !== ADMIN_UID) {

                await addDoc(collection(db, "notifications"), {
                    targetUid: ADMIN_UID,
                    senderUid: user.uid,
                    senderName: user.displayName,
                    postId: p.id,
                    commentId: commentRef.id,
                    type: "comment",
                    read: false,
                    createdAt: serverTimestamp()
                });

            }

            console.log("3. 알림 저장 완료");

            commentInput.value = "";

            await loadComments(p.id, commentsDiv, commentCountEl);

            console.log("4. 댓글 다시 불러오기 완료");

        } catch (err) {
            console.error("댓글 등록 오류", err);
        }
    });

    /* =====================
       LOAD COMMENTS
    ===================== */

    async function loadComments(postId, commentsDiv, commentCountEl) {

        const q = query(
            collection(db, "people", postId, "comments"),
            orderBy("createdAt", "asc")
        );

        const snap = await getDocs(q);

        const list = snap.docs.map(d => ({
            id: d.id,
            ...d.data()
        }));

        commentCountEl.textContent = list.length;

        const map = {};
        const roots = [];

        list.forEach(c => {
            map[c.id] = { ...c, replies: [] };
        });

        list.forEach(c => {
            const node = map[c.id];

            if (c.parentId && map[c.parentId] && c.parentId !== c.id) {
                map[c.parentId].replies.push(node);
            } else {
                roots.push(node);
            }
        });

        commentsDiv.innerHTML = "";

        roots.forEach(c => {
            commentsDiv.appendChild(renderComment(c));
        });
    }

    function renderComment(c, depth = 0){

        const div = document.createElement("div");
        div.className = "comment";

        div.id = `comment-${c.id}`;
        div.style.marginLeft = `${depth * 20}px`;

        div.innerHTML = `
            <div class="commentRow">
                <div class="left">
                    <img src="${c.photo || 'images/no-image.jpg'}">
                    <span class="name">${c.name}</span>
                </div>

                <div class="text">${c.text}</div>

                <div class="right">
                    <span class="time">
                        ${c.createdAt ? formatDate(c.createdAt) : ""}
                    </span>
                    ${c.editedAt ? `<span class="edited">수정됨</span>` : ""}
                </div>
            </div>
        `;

        const action = document.createElement("div");
        action.className = "actions";

        // ======================
        // 답글 버튼
        // ======================
        const replyBtn = document.createElement("button");
        const replyCount = c.replies?.length || 0;
        replyBtn.textContent = replyCount ? `답글 (${replyCount})` : "답글";

        replyBtn.onclick = () => {

            const old = div.querySelector(".inline-reply");
            if (old) old.remove();

            const form = document.createElement("div");
            form.className = "inline-reply";

            form.innerHTML = `
                <textarea placeholder="답글 입력"></textarea>
                <div style="display:flex; gap:6px; margin-top:6px;">
                    <button class="send">전송</button>
                    <button class="cancel">취소</button>
                </div>
            `;

            div.insertBefore(form, action);

            const textarea = form.querySelector("textarea");
            textarea.focus();

            form.querySelector(".send").onclick = async () => {

                const text = textarea.value.trim();
                if (!text) return;

                if (!auth.currentUser) {
                  await login();
                }

                const user = auth.currentUser;

                const replyRef = await addDoc(
                  collection(db, "people", p.id, "comments"),
                  {
                    uid: user.uid,
                    name: user.displayName || user.email || "익명",
                    photo: user.photoURL,
                    text: text,
                    postId: p.id,
                    parentId: c.id,
                    createdAt: serverTimestamp()
                  }
                );

                console.log("댓글 저장 성공");

                /* ⭐ 여기부터 알림 */
                await addDoc(collection(db, "notifications"), {
                  targetUid: ADMIN_UID,
                  senderUid: user.uid,
                  senderName: user.displayName || user.email || "익명",
                  postId: p.id,
                  commentId: replyRef.id,   // ← 여기만 변경
                  type: "comment",
                  read: false,
                  createdAt: serverTimestamp()
                });

                // ★ 답글 알림 생성
                if (c.uid !== user.uid) {

                    try {

                        await addDoc(
                            collection(db, "notifications"),
                            {
                                targetUid: c.uid,

                                senderUid: user.uid,

                                senderName:
                                    user.displayName ||
                                    user.providerData?.[0]?.displayName ||
                                    user.email ||
                                    "익명",

                                postId: p.id,

                                commentId: c.id,

                                type: "reply",

                                read: false,

                                createdAt: serverTimestamp()
                            }
                        );

                    } catch (e) {
                        console.error("답글 알림 저장 실패", e);
                    }
                }

                await loadComments(p.id, commentsDiv, commentCountEl);
            };

            form.querySelector(".cancel").onclick = () => {
                form.remove();
            };
        };

        action.appendChild(replyBtn);

        // ======================
        // 권한 체크 (삭제/수정)
        // ======================
        const isOwner =
            auth.currentUser &&
            (auth.currentUser.uid === c.uid ||
             auth.currentUser.email === ADMIN_EMAIL);

        if (isOwner) {

            // 수정
            const editBtn = document.createElement("button");
            editBtn.textContent = "수정";

            editBtn.onclick = () => {

                const old = div.querySelector(".inline-edit");
                if (old) old.remove();

                const form = document.createElement("div");
                form.className = "inline-edit";

                form.innerHTML = `
                    <textarea>${c.text}</textarea>
                    <div style="display:flex; gap:6px; margin-top:6px;">
                        <button class="save">저장</button>
                        <button class="cancel">취소</button>
                    </div>
                `;

                div.insertBefore(form, action);

                const textarea = form.querySelector("textarea");
                textarea.focus();

                form.querySelector(".save").onclick = async () => {
                    const newText = textarea.value.trim();
                    if (!newText) return;

                    await updateDoc(
                        doc(db, "people", p.id, "comments", c.id),
                        {
                            text: newText,
                            editedAt: serverTimestamp()
                        }
                    );

                    await loadComments(p.id, commentsDiv, commentCountEl);    
                };

                form.querySelector(".cancel").onclick = () => {
                    form.remove();
                };
            };

            // 삭제
            const delBtn = document.createElement("button");
            delBtn.textContent = "삭제";

            delBtn.onclick = async () => {

                if (!confirm("댓글과 답글을 삭제할까요?")) return;

                const snap = await getDocs(
                    collection(db, "people", p.id, "comments")
                );

                const all = snap.docs.map(d => ({
                    id: d.id,
                    ...d.data()
                }));

                const targets = new Set([c.id]);

                let changed = true;

                while (changed) {
                    changed = false;

                    for (const item of all) {
                        if (targets.has(item.parentId) && !targets.has(item.id)) {
                            targets.add(item.id);
                            changed = true;
                        }
                    }
                }

                const deletePromises = [];

                for (const id of targets) {
                    deletePromises.push(
                        deleteDoc(doc(db, "people", p.id, "comments", id))
                    );
                }

                await Promise.all(deletePromises);
                await loadComments(p.id, commentsDiv, commentCountEl);
                return; // ⭐ 중요: 이벤트 종료 강제;
            }; // ⭐⭐⭐ 여기서 끝

            action.appendChild(editBtn);
            action.appendChild(delBtn);
        }

        div.appendChild(action);

        // ======================
        // 재귀 렌더
        // ======================

        c.replies.forEach(r => {
            div.appendChild(renderComment(r, depth + 1));
        });

        return div;
    }

    await loadLikes();
    await loadComments(p.id, commentsDiv, commentCountEl);

} // openModal 종료

   AUTH
========================= */

loginBtn.addEventListener("click", login);
logoutBtn.addEventListener("click", logout);

let notifUnsub = null;

watchAuth(async user => {

    const userInfo = document.getElementById("userInfo");

    if(!user){

        userInfo.textContent = "로그인 안 됨";
        
        document.getElementById("badge").textContent = "0";
        document.getElementById("notificationList").innerHTML = "";

        loginBtn.style.display = "inline-block";
        logoutBtn.style.display = "none";

        container.innerHTML = `
          <div style="
            width:100%;
            display:flex;
            justify-content:center;
            padding:40px 20px;
            box-sizing:border-box;
          ">
            <div style="
              width:100%;
              max-width:360px;
              background:white;
              border-radius:16px;
              padding:24px;
              box-shadow:0 6px 18px rgba(0,0,0,0.12);
              display:flex;
              flex-direction:column;
              gap:16px;
            ">

              <div style="
                font-size:18px;
                font-weight:700;
                line-height:1.4;
                display:flex;
                justify-content:center;
                align-items:center;
                white-space:nowrap;
                min-width:0;
              ">
                <span style="
                  flex:1;
                  min-width:0;
                  text-align:center;
                ">
                  🔒 로그인 후 이용 가능합니다.
                </span>
              </div>

              <button id="needLoginBtn" style="
                background:#4285F4;
                color:white;
                border:none;
                border-radius:10px;
                padding:12px 14px;
                font-size:15px;
                cursor:pointer;
                width:100%;
              ">
                로그인
              </button>

            </div>
          </div>
        `;
        
        document
            .getElementById("needLoginBtn")
            ?.addEventListener("click", login);

        return;
    }

    // ⭐ 한 번만 실행
    if (user.displayName !== "Kay") {
        await updateProfile(user, {
            displayName: "Kay"
        });
        await user.reload();
    }

    userInfo.textContent = user.email;

    loginBtn.style.display = "none";
    logoutBtn.style.display = "inline-block";

    /* =========================
       🔥 알림 구독 (중복 방지 핵심)
    ========================= */

    if (notifUnsub) {
        notifUnsub();
        notifUnsub = null;
    }

    notifUnsub = onSnapshot(
        query(
            collection(db, "notifications"),
            where("targetUid", "==", user.uid)
        ),
        (snap) => {

            const list = [];

            snap.forEach(docItem => {
                list.push({
                    id: docItem.id,
                    ...docItem.data()
                });
            });
            
            renderNotifications(list);
        }
    );

    /* =========================
       렌더
    ========================= */

    function renderNotifications(list){

        const badge = document.getElementById("badge");

        const unread = list.filter(n => !n.read).length;
        badge.textContent = unread;

        const box = document.getElementById("notificationList");

        box.innerHTML = `
        <div class="notification-header">
            <button id="deleteAllNotificationsBtn">
                전체 삭제
            </button>
        </div>
        `;
        
        document.getElementById("deleteAllNotificationsBtn").onclick = async () => {

            if (!auth.currentUser) return;

            if (!confirm("모든 알림을 삭제하시겠습니까?")) return;

            await deleteAllNotifications(auth.currentUser.uid);
        };

        list
            .sort((a,b)=> (b.createdAt?.seconds || 0) - (a.createdAt?.seconds || 0))
            .forEach(n => {

                const div = document.createElement("div");
                div.className = "notification-item";

                div.onclick = async () => {
                    await openNotification(n);
                };

                // 알림 내용
                const text = document.createElement("span");
                text.textContent =
                    `🔔 ${n.senderName} 님이 답글을 남겼습니다`;

                // X 버튼
                const delBtn = document.createElement("button");
                delBtn.textContent = "✕";
                delBtn.className = "notification-delete";

                delBtn.onclick = async (e) => {
                    e.stopPropagation();

                    if (!confirm("이 알림을 삭제할까요?")) return;

                    await deleteDoc(
                        doc(db, "notifications", n.id)
                    );
                };

                div.appendChild(text);
                div.appendChild(delBtn);

                box.appendChild(div);
            });
    }

    async function openNotification(n){

        try {
            await updateDoc(
                doc(db, "notifications", n.id),
                { read: true }
            );
        } catch (e) {
            console.warn(e);
        }

        const person = people.find(
            p => p.id === n.postId
        );

        if (!person) return;

        openModal(person);

        // 🔥 여기 핵심 추가
        setTimeout(() => {

            if (n.commentId) {
                const target = document.getElementById(`comment-${n.commentId}`);

                if (target) {
                    target.scrollIntoView({
                        behavior: "smooth",
                        block: "center",
                        inline: "nearest"
                    });

                    // 살짝 강조 효과
                    target.style.background = "#fff3cd";
                    target.style.transition = "0.3s";

                    setTimeout(() => {
                        target.style.background = "";
                    }, 1500);
                }
            }

        }, 300); // 모달 렌더 기다림
    }

    /* =========================
       BELL
    ========================= */

    init();
});

const bellBtn = document.getElementById("bellBtn");
const notificationList = document.getElementById("notificationList");

bellBtn.addEventListener("click", () => {
    console.log("bell clicked");
