<!DOCTYPE html>
<html lang="ko">

<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Kay Notes Archive</title>

<link rel="stylesheet" href="style.css?v=10">

<style>
#peopleContainer{
    contain:layout paint;
}
</style>

</head>

<body>

<header>
    <h1>Kay Notes Archive</h1>

    <div id="userInfo">로그인 안 됨</div>

    <div class="authArea">
        <button id="loginBtn">로그인</button>
        <button id="logoutBtn">로그아웃</button>
    </div>

    <input type="text" id="searchBox" placeholder="검색...">
</header>

<div id="peopleContainer"></div>

<!-- MODAL -->
<div id="modal" class="modal hidden">
    <div class="modal-content">
        <button id="closeModal" class="closeBtn">✕</button>
        <div id="modalBody"></div>
    </div>
</div>

<script type="module">

import people from "./people.js?v=10";

import {
    db,
    auth,
    login,
    logout,
    watchAuth
} from "./firebase.js";

import {
    collection,
    getDocs,
    addDoc,
    deleteDoc,
    doc,
    setDoc,
    getDoc,
    updateDoc,
    query,
    orderBy,
    serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.0.0/firebase-firestore.js";

/* =========================
   CONFIG
========================= */

const ADMIN_EMAIL = "ektjttnfp5@gmail.com";

/* =========================
   DOM
========================= */

const container = document.getElementById("peopleContainer");
const searchBox = document.getElementById("searchBox");
const modal = document.getElementById("modal");
const modalBody = document.getElementById("modalBody");
const closeModal = document.getElementById("closeModal");

const loginBtn = document.getElementById("loginBtn");
const logoutBtn = document.getElementById("logoutBtn");

/* =========================
   STATE
========================= */

let data = [];
let renderedMap = new Map();

/* =========================
   INIT
========================= */

function init(){
    if(!Array.isArray(people)) return;
    data = people;
    render(data);
}

/* =========================
   CARD
========================= */

function createCard(p, index){

    const card = document.createElement("div");
    card.className = "card";

    const img = document.createElement("img");
    img.src = p.image ? "images/" + p.image : "images/no-image.jpg";
    img.loading = "lazy";
    img.decoding = "async";

    const photo = document.createElement("div");
    photo.className = "photo";
    photo.appendChild(img);

    const info = document.createElement("div");
    info.className = "info";

    const nameEl = document.createElement("div");
    nameEl.className = "name";

    const enEl = document.createElement("div");
    enEl.className = "en";

    const no = p.no || (index + 1);

    enEl.innerHTML = `
        <span class="num">${no}.</span>
        <span class="txt">${p.name || ""}</span>
    `;

    nameEl.appendChild(enEl);

    if(p.ko){
        const koEl = document.createElement("div");
        koEl.className = "ko";
        koEl.textContent = p.ko;
        nameEl.appendChild(koEl);
    }

    const metaEl = document.createElement("div");
    metaEl.className = "meta";
    metaEl.textContent = p.tags ? p.tags.join(" · ") : "";

    const descEl = document.createElement("div");
    descEl.className = "desc";
    descEl.innerHTML = p.note || "";

    info.appendChild(nameEl);
    info.appendChild(metaEl);
    info.appendChild(descEl);

    card.appendChild(photo);
    card.appendChild(info);

    card.addEventListener("click", () => openModal(p));

    return card;
}

/* =========================
   RENDER
========================= */

function render(list){

    const fragment = document.createDocumentFragment();

    list.forEach((p, index)=>{

        const key = (p.no || index) + "_" + p.name;

        if(renderedMap.has(key)){
            fragment.appendChild(renderedMap.get(key));
        } else {
            const card = createCard(p, index);
            renderedMap.set(key, card);
            fragment.appendChild(card);
        }
    });

    container.replaceChildren(fragment);
}

/* =========================
   SEARCH
========================= */

function debounce(fn, delay = 150){
    let t;
    return (...args)=>{
        clearTimeout(t);
        t = setTimeout(()=>fn(...args), delay);
    };
}

const handleSearch = debounce(value=>{
    const k = value.toLowerCase();

    const filtered = data.filter(p =>
        (p.name || "").toLowerCase().includes(k) ||
        (p.ko || "").toLowerCase().includes(k) ||
        (p.note || "").toLowerCase().includes(k)
    );

    render(filtered);
});

searchBox.addEventListener("input", e=>{
    handleSearch(e.target.value);
});

/* =========================
   MODAL
========================= */

function formatDate(ts){
    if(!ts) return "";

    const d = ts.toDate();

    const yyyy = d.getFullYear();
    const mm = String(d.getMonth()+1).padStart(2,"0");
    const dd = String(d.getDate()).padStart(2,"0");

    const hh = String(d.getHours()).padStart(2,"0");
    const mi = String(d.getMinutes()).padStart(2,"0");
    const ss = String(d.getSeconds()).padStart(2,"0");

    return `${yyyy}-${mm}-${dd} ${hh}:${mi}:${ss}`;
}
            
async function openModal(p){

    modal.classList.remove("hidden");

    modalBody.innerHTML = `
        <img class="modal-photo" src="images/${p.image || 'no-image.jpg'}">

        <div class="modal-name">${p.displayName || p.name}</div>
        <div class="modal-desc">${p.note || ""}</div>

        <div class="likeArea">
            <button class="likeBtn">👍 좋아요</button>
            <span class="likeCount">0</span>

            <span class="commentLabel">💬 댓글</span>
            <span class="commentCount">0</span>

            <button class="showLikesBtn" style="display:none;">추천자 보기</button>
        </div>

        <div class="commentArea">
            <textarea class="commentInput" placeholder="댓글 입력 (최대 1000자)"></textarea>
            <button class="commentBtn">등록</button>
            <div class="comments"></div>
        </div>
    `;

    const likeBtn = modalBody.querySelector(".likeBtn");
    const likeCountEl = modalBody.querySelector(".likeCount");
    const commentCountEl = modalBody.querySelector(".commentCount");
    const showLikesBtn = modalBody.querySelector(".showLikesBtn");

    /* 🔥 여기 */
    if(auth.currentUser?.email === ADMIN_EMAIL){
        showLikesBtn.style.display = "inline-block";
    } else {
        showLikesBtn.style.display = "none";
    }

    const commentBtn = modalBody.querySelector(".commentBtn");
    const commentInput = modalBody.querySelector(".commentInput");
    const commentsDiv = modalBody.querySelector(".comments");
    
    let replyTarget = null;

    /* =====================
       SHOW LIKES (한 번만 등록)
    ===================== */

    showLikesBtn.addEventListener("click", async ()=>{
        const snap = await getDocs(
            collection(db, "people", p.name, "likes")
        );

        const result = snap.docs
            .map(d => d.data().name || "이름 없음")
            .join("\n");

        alert(result || "추천 없음");
    });

    /* =====================
       LOAD LIKES
    ===================== */

    async function loadLikes(){
        const snap = await getDocs(
            collection(db, "people", p.name, "likes")
        );

        likeCountEl.textContent = snap.size;
    }

    /* =====================
       LIKE TOGGLE
    ===================== */

    likeBtn.addEventListener("click", async ()=>{

        const user = auth.currentUser || await login();

        const ref = doc(db, "people", p.name, "likes", user.uid);

        const liked = await getDoc(ref);

        if(liked.exists()){
            await deleteDoc(ref);
        } else {
            await setDoc(ref, {
                uid: user.uid,
                name:
                  user.providerData?.[0]?.displayName ||
                  user.displayName ||
                  user.email ||
                  "익명",
                photo: user.photoURL,
                createdAt: Date.now()
            });
        }

        if(auth.currentUser?.email === ADMIN_EMAIL){
            showLikesBtn.style.display = "inline-block";
        }

        loadLikes();
    });

    /* =====================
       COMMENTS
    ===================== */

    commentBtn.addEventListener("click", async ()=>{

        const text = commentInput.value.trim();
        if(!text) return;

        if(text.length > 1000){
            alert("댓글은 1000자 이하만 가능합니다.");
            return;
        }

        const user = auth.currentUser || await login();

        await addDoc(
            collection(db, "people", p.name, "comments"),
            {
                uid: user.uid,
                name:
                  user.providerData?.[0]?.displayName ||
                  user.displayName ||
                  user.email ||
                  "익명",

                photo: user.photoURL,

                text,

                parentId: null,

                createdAt: serverTimestamp()
            }
        );

        commentInput.value = "";
        loadComments();
    });

    /* =====================
       LOAD COMMENTS
    ===================== */

    async function loadComments(){

        const q = query(
            collection(db, "people", p.name, "comments"),
            orderBy("createdAt", "asc")
        );

        const snap = await getDocs(q);

        const list = [];

        snap.forEach(docSnap=>{
            list.push({
                id: docSnap.id,
                ...docSnap.data()
            });
        });

        console.table(
            list.map(x => ({
                text: x.text,
                parentId: x.parentId
            }))
        );

        commentCountEl.textContent = list.length;

        const map = {};
        const roots = [];

        list.forEach(c=>{
            map[c.id] = {
                ...c,
                replies:[]
            };
        });

        commentCountEl.textContent = list.length;

        list.forEach(c=>{

            if(c.parentId){
                map[c.parentId]?.replies.push(map[c.id]);
            }else{
                roots.push(map[c.id]);
            }

        });

        commentsDiv.innerHTML = "";

        roots.forEach(c=>{
            commentsDiv.appendChild(
                renderComment(c)
            );
        });
    }

    function renderComment(c, depth = 0){

        const div = document.createElement("div");

        div.className = "comment";

        div.style.marginLeft = `${depth * 25}px`;

        div.innerHTML = `
            <div class="commentRow">

                <div class="left">
                    <img src="${c.photo || 'images/no-image.jpg'}">
                    <span class="name">${c.name}</span>
                </div>

                <div class="text">
                    ${c.text}
                </div>

                <div class="right">
                    <span class="time">
                        ${c.createdAt ? formatDate(c.createdAt) : ""}
                    </span>

                    ${c.editedAt ? '<span class="edited">수정됨</span>' : ''}
                </div>

            </div>
        `;

        const action = document.createElement("div");
        action.className = "actions";

        const replyBtn = document.createElement("button");

        const replyCount = c.replies?.length || 0;

        replyBtn.textContent =
            replyCount > 0
                ? `답글 (${replyCount})`
                : "답글";

        replyBtn.onclick = async ()=>{

            const text = prompt("답글 입력");

            if(!text) return;

            const user = auth.currentUser || await login();

            await addDoc(
                collection(db, "people", p.name, "comments"),
                {
                    uid: user.uid,
                    name:
                        user.providerData?.[0]?.displayName ||
                        user.displayName ||
                        user.email ||
                        "익명",

                    photo: user.photoURL,

                    text,

                    parentId: c.id,

                    createdAt: serverTimestamp()
                }
            );

            loadComments();
        };

        action.appendChild(replyBtn);

        if(
            auth.currentUser &&
            (
                c.uid === auth.currentUser.uid ||
                auth.currentUser.email === ADMIN_EMAIL
            )
        ){

            const editBtn = document.createElement("button");
            editBtn.textContent = "수정";

            editBtn.onclick = async ()=>{

                const newText = prompt("댓글 수정", c.text);

                if(!newText) return;

                await updateDoc(
                    doc(
                        db,
                        "people",
                        p.name,
                        "comments",
                        c.id
                    ),
                    {
                        text:newText,
                        editedAt:serverTimestamp()
                    }
                );

                loadComments();
            };

            const delBtn = document.createElement("button");
            delBtn.textContent = "삭제";

            delBtn.onclick = async ()=>{

                if(!confirm("삭제할까요?")) return;

                await deleteDoc(
                    doc(
                        db,
                        "people",
                        p.name,
                        "comments",
                        c.id
                    )
                );

                loadComments();
            };

            action.appendChild(editBtn);
            action.appendChild(delBtn);
        }

        div.appendChild(action);

        c.replies.forEach(reply=>{
            div.appendChild(
                renderComment(reply, depth + 1)
            );
        });

        return div;
    }
    
    await loadLikes();
    await loadComments();

} // openModal 종료

/* =========================
   CLOSE MODAL
========================= */

closeModal.addEventListener("click", ()=>{
    modal.classList.add("hidden");
});

modal.addEventListener("click", e=>{
    if(e.target === modal){
        modal.classList.add("hidden");
    }
});

/* =========================
   AUTH
========================= */

loginBtn.addEventListener("click", login);
logoutBtn.addEventListener("click", logout);

watchAuth(user=>{
    const userInfo = document.getElementById("userInfo");

    if(!user){
        userInfo.textContent = "로그인 안 됨";
        loginBtn.style.display = "inline-block";
        logoutBtn.style.display = "none";
        return;
    }

    userInfo.textContent = user.email;
    loginBtn.style.display = "none";
    logoutBtn.style.display = "inline-block";
});

/* =========================
   START
========================= */

init();

</script>

</body>
</html>
