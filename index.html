<script type="module">

import people from "./people.js?v=3";

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.0.0/firebase-app.js";
import {
  getAuth,
  GoogleAuthProvider,
  signInWithPopup,
  signOut,
  onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.0.0/firebase-auth.js";

import {
  getFirestore,
  collection,
  addDoc,
  getDocs,
  query,
  orderBy,
  serverTimestamp,
  deleteDoc,
  doc,
  getDoc,
  setDoc
} from "https://www.gstatic.com/firebasejs/12.0.0/firebase-firestore.js";

/* =======================
   Firebase
======================= */
const firebaseConfig = {
  apiKey: "AIzaSyCAZzJdAB_a65dkJaL-XLQqzImzlSI8Gmw",
  authDomain: "kay-gallery.firebaseapp.com",
  projectId: "kay-gallery",
  storageBucket: "kay-gallery.firebasestorage.app",
  messagingSenderId: "276470297982",
  appId: "1:276470297982:web:838b8a57269b26cd3d6f2f"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

/* =======================
   Safe DOM
======================= */
const $ = (id) => document.getElementById(id);

let container, searchBox, loginBtn, logoutBtn, userBox;

let data = [];
let renderedMap = new Map();
let currentPersonNo = null;

/* =======================
   INIT SAFE
======================= */
document.addEventListener("DOMContentLoaded", () => {

  container = $("peopleContainer");
  searchBox = $("searchBox");
  loginBtn = $("loginBtn");
  logoutBtn = $("logoutBtn");
  userBox = $("userBox");

  if (!Array.isArray(people)) {
    console.error("people.js 로딩 실패");
    return;
  }

  data = people;
  render(data);

  bindEvents();
});

/* =======================
   EVENTS
======================= */
function bindEvents() {

  if (searchBox) {
    searchBox.addEventListener("input", debounce(e => {
      const k = e.target.value.toLowerCase();

      render(
        data.filter(p =>
          (p.name || "").toLowerCase().includes(k) ||
          (p.ko || "").toLowerCase().includes(k) ||
          (p.note || "").toLowerCase().includes(k)
        )
      );
    }, 150));
  }

  if (loginBtn) {
    loginBtn.onclick = async () => {
      try {
        const provider = new GoogleAuthProvider();
        await signInWithPopup(auth, provider);
      } catch (e) {
        alert("로그인 실패");
        console.error(e);
      }
    };
  }

  if (logoutBtn) {
    logoutBtn.onclick = () => signOut(auth);
  }

  onAuthStateChanged(auth, user => {
    if (!loginBtn || !logoutBtn || !userBox) return;

    loginBtn.hidden = !!user;
    logoutBtn.hidden = !user;
    userBox.textContent = user ? `👤 ${user.displayName}` : "";
  });

  const saveBtn = $("saveComment");
  if (saveBtn) {
    saveBtn.onclick = saveComment;
  }
}

/* =======================
   CARD
======================= */
function createCard(p, index) {

  const card = document.createElement("div");
  card.className = "card";

  const no = p.no || index + 1;

  const photo = document.createElement("div");
  photo.className = "photo";

  const img = document.createElement("img");
  img.src = p.image ? "images/" + p.image : "images/no-image.jpg";
  photo.appendChild(img);

  const info = document.createElement("div");
  info.className = "info";

  const actions = document.createElement("div");
  actions.innerHTML = `
    <button class="likeBtn">👍 0</button>
    <button class="viewLikesBtn">👥 추천자</button>
    <button class="commentBtn">💬 댓글</button>
  `;

  const likeBtn = actions.querySelector(".likeBtn");
  const viewLikesBtn = actions.querySelector(".viewLikesBtn");
  const commentBtn = actions.querySelector(".commentBtn");

  /* LIKE */
  async function loadLike() {
    try {
      const snap = await getDocs(collection(db, "likes", String(no), "users"));
      likeBtn.textContent = `👍 ${snap.size}`;
    } catch {}
  }

  loadLike();

  likeBtn.onclick = async () => {
    const user = auth.currentUser;
    if (!user) return alert("로그인 필요");

    const ref = doc(db, "likes", String(no), "users", user.uid);

    const snap = await getDoc(ref);

    if (snap.exists()) {
      await deleteDoc(ref);
    } else {
      await setDoc(ref, {
        name: user.displayName,
        createdAt: serverTimestamp()
      });
    }

    await loadLike();
  };

  viewLikesBtn.onclick = async () => {
    const snap = await getDocs(collection(db, "likes", String(no), "users"));
    const names = snap.docs.map(d => d.data().name).filter(Boolean);

    alert(names.length ? names.join("\n") : "없음");
  };

  commentBtn.onclick = () => {
    const modal = $("commentModal");
    const title = $("modalTitle");

    if (!modal || !title) return;

    currentPersonNo = String(no);
    title.textContent = p.name;
    modal.style.display = "block";

    loadComments();
  };

  info.innerHTML = `
    <div>${no}. ${p.name}</div>
  `;

  info.appendChild(actions);

  card.appendChild(photo);
  card.appendChild(info);

  return card;
}

/* =======================
   RENDER
======================= */
function render(list) {
  if (!container) return;

  const frag = document.createDocumentFragment();

  list.forEach((p, i) => {
    const key = (p.no || i) + "_" + p.name;

    if (renderedMap.has(key)) {
      frag.appendChild(renderedMap.get(key));
    } else {
      const el = createCard(p, i);
      renderedMap.set(key, el);
      frag.appendChild(el);
    }
  });

  container.replaceChildren(frag);
}

/* =======================
   COMMENTS
======================= */
async function loadComments() {

  const list = $("commentList");
  if (!list) return;

  list.innerHTML = "";

  const q = query(
    collection(db, "comments", currentPersonNo, "items"),
    orderBy("createdAt", "asc")
  );

  const snap = await getDocs(q);

  snap.forEach(d => {
    const div = document.createElement("div");
    div.textContent = `${d.data().user}: ${d.data().text}`;
    list.appendChild(div);
  });
}

async function saveComment() {

  const user = auth.currentUser;
  if (!user) return alert("로그인 필요");

  const input = $("commentInput");
  if (!input) return;

  const text = input.value.trim();
  if (!text) return;

  await addDoc(
    collection(db, "comments", currentPersonNo, "items"),
    {
      text,
      user: user.displayName,
      uid: user.uid,
      createdAt: serverTimestamp()
    }
  );

  input.value = "";
  await loadComments();
}

/* =======================
   UTIL
======================= */
function debounce(fn, t) {
  let id;
  return (...args) => {
    clearTimeout(id);
    id = setTimeout(() => fn(...args), t);
  };
}

</script>
