<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kay Notes Archive</title>

<link rel="stylesheet" href="style.css">

<style>
#peopleContainer {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
  gap: 12px;
  padding: 16px;
}

.card {
  border: 1px solid #ddd;
  padding: 10px;
  border-radius: 8px;
  background: white;
  transition: 0.2s;
}

.card:hover {
  transform: translateY(-2px);
}

.card img {
  width: 100%;
  height: 140px;
  object-fit: cover;
  background: #f2f2f2;
  border-radius: 6px;
}

.name {
  margin-top: 6px;
  font-size: 14px;
  font-weight: bold;
}

.note {
  font-size: 12px;
  color: #666;
  margin-top: 2px;
}

#errorBox {
  color: red;
  padding: 10px;
}
</style>
</head>

<body>

<header>
  <h1>Kay Notes Archive</h1>
  <input type="text" id="searchBox" placeholder="검색...">
</header>

<div id="errorBox"></div>
<div id="peopleContainer"></div>

<!-- ✅ 핵심: ES Module로 변경 -->
<script type="module">
import people from "./people.js";

const container = document.getElementById("peopleContainer");
const searchBox = document.getElementById("searchBox");
const errorBox = document.getElementById("errorBox");

let data = [];

/* =========================
   초기화
========================= */
function init() {

  if (!Array.isArray(people)) {
    errorBox.innerText =
      "❌ people.js 형식이 올바르지 않습니다 (export default people 확인)";
    return;
  }

  data = people;

  render(data);
}

/* =========================
   렌더
========================= */
function render(list) {
  container.innerHTML = "";

  list.forEach(p => {
    const card = document.createElement("div");
    card.className = "card";

    card.innerHTML = `
      <img src="${p.image}" onerror="this.src='images/placeholder.jpg'">
      <div class="name">${p.name} / ${p.ko || ""}</div>
      <div class="note">${p.note || ""}</div>
    `;

    container.appendChild(card);
  });
}

/* =========================
   검색
========================= */
searchBox.addEventListener("input", (e) => {
  const k = e.target.value.toLowerCase();

  const filtered = data.filter(p =>
    (p.name || "").toLowerCase().includes(k) ||
    (p.ko || "").toLowerCase().includes(k) ||
    (p.note || "").toLowerCase().includes(k)
  );

  render(filtered);
});

/* =========================
   실행
========================= */
init();

</script>

</body>
</html>
