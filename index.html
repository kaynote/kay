<script type="module">

import people from "./people.js?v=10";

import {
    db,
    auth,
    login,
    logout,
    watchAuth
} from "./firebase.js";

import {
    collection,
    getDocs,
    addDoc,
    deleteDoc,
    doc,
    setDoc,
    getDoc,
    query,
    orderBy,
    serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";

/* =========================
   CONFIG
========================= */

const ADMIN_EMAIL = "ektjttnfp5@gmail.com";

/* =========================
   DOM
========================= */

const container = document.getElementById("peopleContainer");
const searchBox = document.getElementById("searchBox");
const modal = document.getElementById("modal");
const modalBody = document.getElementById("modalBody");
const closeModal = document.getElementById("closeModal");

const loginBtn = document.getElementById("loginBtn");
const logoutBtn = document.getElementById("logoutBtn");

/* =========================
   STATE
========================= */

let data = Array.isArray(people) ? people : [];
let renderedMap = new Map();

/* =========================
   SAFE KEY
========================= */

function getKey(p, index){
    return `${p?.id || p?.name || "no-id"}_${index}`;
}

/* =========================
   INIT
========================= */

function init(){
    render(data);
}

/* =========================
   CARD
========================= */

function createCard(p, index){

    const card = document.createElement("div");
    card.className = "card";

    const img = document.createElement("img");
    img.src = p?.image ? `images/${p.image}` : "images/no-image.jpg";
    img.loading = "lazy";

    const photo = document.createElement("div");
    photo.className = "photo";
    photo.appendChild(img);

    const info = document.createElement("div");
    info.className = "info";

    const nameEl = document.createElement("div");
    nameEl.className = "name";

    const enEl = document.createElement("div");
    enEl.className = "en";

    const no = p?.no || index + 1;

    enEl.innerHTML = `
        <span class="num">${no}.</span>
        <span class="txt">${p?.id || p?.name || ""}</span>
    `;

    nameEl.appendChild(enEl);

    if(p?.ko){
        const koEl = document.createElement("div");
        koEl.className = "ko";
        koEl.textContent = p.ko;
        nameEl.appendChild(koEl);
    }

    const metaEl = document.createElement("div");
    metaEl.className = "meta";
    metaEl.textContent = Array.isArray(p?.tags) ? p.tags.join(" · ") : "";

    const descEl = document.createElement("div");
    descEl.className = "desc";
    descEl.innerHTML = p?.note || "";

    info.appendChild(nameEl);
    info.appendChild(metaEl);
    info.appendChild(descEl);

    card.appendChild(photo);
    card.appendChild(info);

    card.addEventListener("click", () => openModal(p));

    return card;
}

/* =========================
   RENDER (STABLE)
========================= */

function render(list){

    const fragment = document.createDocumentFragment();

    list.forEach((p, index)=>{

        const key = getKey(p, index);

        let card = renderedMap.get(key);

        if(!card){
            card = createCard(p, index);
            renderedMap.set(key, card);
        }

        fragment.appendChild(card);
    });

    container.replaceChildren(fragment);
}

/* =========================
   SEARCH
========================= */

function debounce(fn, delay = 150){
    let t;
    return (...args)=>{
        clearTimeout(t);
        t = setTimeout(()=>fn(...args), delay);
    };
}

const handleSearch = debounce(value=>{
    const k = (value || "").toLowerCase();

    const filtered = data.filter(p =>
        (p?.id || p?.name || "").toLowerCase().includes(k) ||
        (p?.ko || "").toLowerCase().includes(k) ||
        (p?.note || "").toLowerCase().includes(k)
    );

    render(filtered);
});

searchBox.addEventListener("input", e=>{
    handleSearch(e.target.value);
});

/* =========================
   MODAL CORE
========================= */

let currentPerson = null;

async function openModal(p){

    currentPerson = p;

    modal.classList.remove("hidden");

    modalBody.innerHTML = `
        <img class="modal-photo" src="images/${p?.image || 'no-image.jpg'}">

        <div class="modal-name">${p?.displayName || p?.id || p?.name || ""}</div>
        <div class="modal-desc">${p?.note || ""}</div>

        <div class="likeArea">
            <button class="likeBtn">👍 좋아요</button>
            <span class="likeCount">0</span>
            <button class="showLikesBtn" style="display:none;">추천자 보기</button>
        </div>

        <div class="commentArea">
            <textarea class="commentInput"></textarea>
            <button class="commentBtn">등록</button>
            <div class="comments"></div>
        </div>
    `;

    setupLikeSystem(p);
    setupCommentSystem(p);
}

/* =========================
   LIKES (SAFE)
========================= */

function setupLikeSystem(p){

    const likeBtn = modalBody.querySelector(".likeBtn");
    const likeCountEl = modalBody.querySelector(".likeCount");
    const showLikesBtn = modalBody.querySelector(".showLikesBtn");

    const id = p?.id || p?.name;
    if(!id) return;

    async function loadLikes(){
        const snap = await getDocs(collection(db, "people", id, "likes"));
        likeCountEl.textContent = snap.size;
    }

    likeBtn.onclick = async () => {

        const user = auth.currentUser || await login();
        const ref = doc(db, "people", id, "likes", user.uid);

        const snap = await getDoc(ref);

        if(snap.exists()){
            await deleteDoc(ref);
        } else {
            await setDoc(ref, {
                uid: user.uid,
                name: user.email || "익명",
                createdAt: Date.now()
            });
        }

        loadLikes();
    };

    showLikesBtn.onclick = async () => {
        const snap = await getDocs(collection(db, "people", id, "likes"));

        const list = snap.docs.map(d => d.data().name || "익명").join("\n");
        alert(list || "없음");
    };

    if(auth.currentUser?.email === ADMIN_EMAIL){
        showLikesBtn.style.display = "inline-block";
    }

    loadLikes();
}

/* =========================
   COMMENTS (SAFE)
========================= */

function setupCommentSystem(p){

    const commentBtn = modalBody.querySelector(".commentBtn");
    const input = modalBody.querySelector(".commentInput");
    const box = modalBody.querySelector(".comments");

    const id = p?.id || p?.name;
    if(!id) return;

    async function loadComments(){

        const q = query(
            collection(db, "people", id, "comments"),
            orderBy("createdAt", "asc")
        );

        const snap = await getDocs(q);

        box.innerHTML = "";

        const list = [];
        snap.forEach(d => list.push({ id: d.id, ...d.data() }));

        list.filter(c => !c.parentId).forEach(parent => {

            const div = document.createElement("div");
            div.className = "comment";

            div.innerHTML = `
                <div>${parent.name || "익명"}: ${parent.text || ""}</div>
                <button class="replyBtn">답글</button>
            `;

            div.querySelector(".replyBtn").onclick = async () => {
                const text = prompt("답글");
                if(!text) return;

                const user = auth.currentUser || await login();

                await addDoc(collection(db, "people", id, "comments"), {
                    text,
                    uid: user.uid,
                    name: user.email || "익명",
                    parentId: parent.id,
                    createdAt: serverTimestamp()
                });

                loadComments();
            };

            box.appendChild(div);

            list.filter(r => r.parentId === parent.id).forEach(reply => {
                const rdiv = document.createElement("div");
                rdiv.style.marginLeft = "20px";
                rdiv.textContent = `↳ ${reply.name}: ${reply.text}`;
                box.appendChild(rdiv);
            });
        });
    }

    commentBtn.onclick = async () => {

        const text = input.value.trim();
        if(!text) return;

        const user = auth.currentUser || await login();

        await addDoc(collection(db, "people", id, "comments"), {
            text,
            uid: user.uid,
            name: user.email || "익명",
            parentId: null,
            createdAt: serverTimestamp()
        });

        input.value = "";
        loadComments();
    };

    loadComments();
}

/* =========================
   CLOSE MODAL
========================= */

closeModal.onclick = () => modal.classList.add("hidden");

modal.onclick = (e) => {
    if(e.target === modal){
        modal.classList.add("hidden");
    }
};

/* =========================
   AUTH
========================= */

loginBtn.onclick = login;
logoutBtn.onclick = logout;

watchAuth(user=>{
    document.getElementById("userInfo").textContent =
        user?.email || "로그인 안 됨";
});

/* =========================
   START
========================= */

init();

</script>
