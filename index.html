<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kay Notes Archive</title>

<link rel="stylesheet" href="style.css">

<style>
/* 🔥 1. layout 안정화 */
#peopleContainer {
  contain: layout paint;
}
</style>

</head>

<body>

<header>
  <h1>Kay Notes Archive</h1>
  <input type="text" id="searchBox" placeholder="검색...">
</header>

<div id="peopleContainer"></div>

<script type="module">
import people from "./people.js";

const container = document.getElementById("peopleContainer");
const searchBox = document.getElementById("searchBox");

let data = [];

/* =========================
   init (중복 방지 포함)
========================= */
let initialized = false;

function init() {
  if (initialized) return;
  initialized = true;

  if (!Array.isArray(people)) return;

  data = people;
  render(data);
}

/* =========================
   render (🔥 완전 안정형)
========================= */
function render(list) {

  // 🔥 2. DOM 완전 초기화 (중복/덜덜 방지 핵심)
  container.replaceChildren();

  container.innerHTML = list.map(p => `
    <div class="card">

      <div class="photo">
        <img
          src="${p.image}"
          loading="lazy"
          style="display:block"
          onerror="this.src='images/placeholder.jpg'">
      </div>

      <div class="info">
        <div class="name">${p.name} / ${p.ko || ""}</div>

        <div class="meta">
          ${p.tags ? p.tags.join(" · ") : ""}
        </div>

        <div class="desc">
          ${p.note || ""}
        </div>
      </div>

    </div>
  `).join("");
}

/* =========================
   debounce search (안정)
========================= */
function debounce(fn, delay = 150) {
  let t;
  return (...args) => {
    clearTimeout(t);
    t = setTimeout(() => fn(...args), delay);
  };
}

const handleSearch = debounce((value) => {
  const k = value.toLowerCase();

  const filtered = data.filter(p =>
    (p.name || "").toLowerCase().includes(k) ||
    (p.ko || "").toLowerCase().includes(k) ||
    (p.note || "").toLowerCase().includes(k)
  );

  render(filtered);
}, 150);

searchBox.addEventListener("input", e => {
  handleSearch(e.target.value);
});

/* =========================
   start
========================= */
init();

</script>

</body>
</html>
