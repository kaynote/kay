<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kay Notes</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <input id="searchBox">
  <div id="peopleContainer"></div>

  <button id="loginBtn">login</button>
  <button id="logoutBtn">logout</button>
  <div id="userBox"></div>

  <!-- ❗ 이게 핵심 -->
  <script type="module">
    import people from "./people.js";

    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.0.0/firebase-app.js";
    import {
      getAuth,
      GoogleAuthProvider,
      signInWithPopup,
      signOut,
      onAuthStateChanged
    } from "https://www.gstatic.com/firebasejs/12.0.0/firebase-auth.js";

    import {
      getFirestore,
      collection,
      addDoc,
      getDocs,
      query,
      orderBy,
      serverTimestamp,
      deleteDoc,
      doc,
      getDoc,
      setDoc
    } from "https://www.gstatic.com/firebasejs/12.0.0/firebase-firestore.js";

    /* Firebase */
    const firebaseConfig = {
      apiKey: "AIzaSyCAZzJdAB_a65dkJaL-XLQqzImzlSI8Gmw",
      authDomain: "kay-gallery.firebaseapp.com",
      projectId: "kay-gallery",
      storageBucket: "kay-gallery.appspot.com",
      messagingSenderId: "276470297982",
      appId: "1:276470297982:web:838b8a57269b26cd3d6f2f"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    /* SAFE DOM */
    const container = document.getElementById("peopleContainer");
    const searchBox = document.getElementById("searchBox");
    const loginBtn = document.getElementById("loginBtn");
    const logoutBtn = document.getElementById("logoutBtn");
    const userBox = document.getElementById("userBox");

    let data = [];
    let renderedMap = new Map();

    /* INIT */
    function init() {
      if (!Array.isArray(people)) {
        console.error("people.js 로딩 실패");
        return;
      }
      data = people;
      render(data);
    }

    /* CARD */
    function createCard(p, index) {

      const no = p.no || index + 1;

      const card = document.createElement("div");
      card.className = "card";

      const photo = document.createElement("div");
      const img = document.createElement("img");

      img.src = p.image ? "images/" + p.image : "images/no-image.jpg";
      photo.appendChild(img);

      const info = document.createElement("div");

      const actions = document.createElement("div");
      actions.innerHTML = `
        <button class="likeBtn">👍 0</button>
        <button class="viewLikesBtn">👥 추천자</button>
      `;

      const likeBtn = actions.querySelector(".likeBtn");

      async function loadLike() {
        const snap = await getDocs(collection(db, "likes", String(no), "users"));
        likeBtn.textContent = `👍 ${snap.size}`;
      }

      loadLike();

      likeBtn.onclick = async () => {
        const user = auth.currentUser;
        if (!user) return alert("로그인 필요");

        const ref = doc(db, "likes", String(no), "users", user.uid);
        const snap = await getDoc(ref);

        if (snap.exists()) {
          await deleteDoc(ref);
        } else {
          await setDoc(ref, {
            name: user.displayName,
            createdAt: serverTimestamp()
          });
        }

        loadLike();
      };

      info.innerHTML = `<div>${no}. ${p.name}</div>`;
      info.appendChild(actions);

      card.appendChild(photo);
      card.appendChild(info);

      return card;
    }

    function render(list) {
      const frag = document.createDocumentFragment();

      list.forEach((p, i) => {
        const el = createCard(p, i);
        frag.appendChild(el);
      });

      container.replaceChildren(frag);
    }

    /* SEARCH */
    if (searchBox) {
      searchBox.addEventListener("input", e => {
        const k = e.target.value.toLowerCase();

        render(
          data.filter(p =>
            (p.name || "").toLowerCase().includes(k) ||
            (p.ko || "").toLowerCase().includes(k)
          )
        );
      });
    }

    /* START */
    init();

  </script>

</body>
</html>
