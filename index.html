<script type="module">

import people from "./people.js";

const container =
    document.getElementById("peopleContainer");

const searchBox =
    document.getElementById("searchBox");

let data = [];

let renderedMap = new Map();

/* =========================
   INIT
========================= */
function init(){
    if(!Array.isArray(people)) return;
    data = people;
    render(data);
}

/* =========================
   CREATE CARD
========================= */
function createCard(p, index){

    const card =
        document.createElement("div");

    card.className = "card";

    /* PHOTO */
    const photo =
        document.createElement("div");

    photo.className = "photo";

    const img =
        document.createElement("img");

    img.src = p.image
        ? "images/" + p.image
        : "images/no-image.jpg";

    img.loading = "lazy";
    img.decoding = "async";

    photo.appendChild(img);

    /* INFO */
    const info =
        document.createElement("div");

    info.className = "info";

    /* NAME */
    const nameEl =
        document.createElement("div");

    nameEl.className = "name";

    const enEl =
        document.createElement("div");

    enEl.className = "en";

    const no =
        (p.no || (index + 1));

    enEl.innerHTML =
        `<span class="num">${no}.</span>
         <span class="txt">${p.name || ""}</span>`;

    const koEl =
        document.createElement("div");

    koEl.className = "ko";
    koEl.textContent = p.ko || "";

    nameEl.appendChild(enEl);
    if(p.ko) nameEl.appendChild(koEl);

    /* META */
    const metaEl =
        document.createElement("div");

    metaEl.className = "meta";

    metaEl.textContent =
        p.tags ? p.tags.join(" · ") : "";

    /* DESC */
    const descEl =
        document.createElement("div");

    descEl.className = "desc";

    descEl.textContent = p.note || "";

    /* =========================
       🔥 TIMELINE 추가 (핵심)
    ========================= */
    const timelineEl =
        document.createElement("div");

    timelineEl.className = "timeline";

    if(Array.isArray(p.timeline)){

        p.timeline.forEach(t => {

            const item =
                document.createElement("div");

            item.className = t.type; 
            // "time" or "text"

            item.textContent = t.text;

            timelineEl.appendChild(item);
        });
    }

    /* APPEND */
    info.appendChild(nameEl);
    info.appendChild(metaEl);
    info.appendChild(descEl);

    /* 👇 여기 추가 */
    if(p.timeline && p.timeline.length){
        info.appendChild(timelineEl);
    }

    card.appendChild(photo);
    card.appendChild(info);

    return card;
}

/* =========================
   RENDER
========================= */
function render(list){

    const fragment =
        document.createDocumentFragment();

    list.forEach((p, index) => {

        const key =
            (p.no || index) + "_" + p.name;

        if(renderedMap.has(key)){
            fragment.appendChild(renderedMap.get(key));
        }else{
            const card =
                createCard(p, index);

            renderedMap.set(key, card);
            fragment.appendChild(card);
        }

    });

    container.replaceChildren(fragment);
}

/* =========================
   SEARCH
========================= */
function debounce(fn, delay = 150){
    let t;
    return (...args) => {
        clearTimeout(t);
        t = setTimeout(() => fn(...args), delay);
    };
}

const handleSearch =
    debounce((value) => {

    const k = value.toLowerCase();

    const filtered =
        data.filter(p =>
            (p.name || "").toLowerCase().includes(k) ||
            (p.ko || "").toLowerCase().includes(k) ||
            (p.note || "").toLowerCase().includes(k)
        );

    render(filtered);

}, 150);

searchBox.addEventListener("input", e => {
    handleSearch(e.target.value);
});

/* =========================
   START
========================= */
init();

</script>
