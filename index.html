<!DOCTYPE html>
<html lang="ko">

<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Kay Notes Archive</title>

<link rel="stylesheet" href="style.css?v=10">
</head>

<body>

<header>
    <h1>Kay Notes Archive</h1>

    <div id="userInfo">로그인 안 됨</div>

    <div class="authArea">
        <button id="loginBtn">로그인</button>
        <button id="logoutBtn" style="display:none;">로그아웃</button>
    </div>

    <input type="text" id="searchBox" placeholder="검색...">
</header>

<div id="peopleContainer"></div>

<div id="notify" class="notify"></div>

<button id="bellBtn">🔔 <span id="badge">0</span></button>

<div id="notificationList">
    <div class="notification-header">
        <button id="deleteAllNotificationsBtn">전체 삭제</button>
    </div>
</div>

<!-- MODAL -->
<div id="modal" class="modal hidden">
    <div class="modal-content">
        <button id="closeModal" class="closeBtn">✕</button>
        <div id="modalBody"></div>
    </div>
</div>

<script type="module">

import people from "./people.js?v=10";

import {
    db,
    auth,
    login,
    logout,
    watchAuth,
    deleteAllNotifications
} from "./firebase.js";

import {
    collection,
    getDocs,
    addDoc,
    deleteDoc,
    doc,
    updateDoc,
    setDoc,
    getDoc,
    query,
    orderBy,
    serverTimestamp,
    onSnapshot,
    where
} from "https://www.gstatic.com/firebasejs/12.0.0/firebase-firestore.js";

/* =========================
STATE
========================= */

const ADMIN_UID = "eEltgLaV6oN7MHUXTfQONc2wGAk1";
const ADMIN_EMAIL = "ektjttnfp5@gmail.com";

let currentUser = null;
let notifUnsub = null;

/* =========================
INIT
========================= */

const container = document.getElementById("peopleContainer");
const modal = document.getElementById("modal");
const modalBody = document.getElementById("modalBody");
const closeModal = document.getElementById("closeModal");
const searchBox = document.getElementById("searchBox");

let data = people;

/* =========================
RENDER CARDS
========================= */

function render(list) {
    container.innerHTML = "";

    list.forEach((p) => {
        const div = document.createElement("div");
        div.className = "card";

        div.innerHTML = `
            <div class="photo">
                <img src="images/${p.image || 'no-image.jpg'}">
            </div>
            <div class="info">
                <div class="name">${p.name}</div>
                <div class="meta">${p.tags?.join(" · ") || ""}</div>
            </div>
        `;

        div.onclick = () => openModal(p);

        container.appendChild(div);
    });
}

/* =========================
SEARCH
========================= */

searchBox.addEventListener("input", (e) => {
    const k = e.target.value.toLowerCase();

    const filtered = data.filter(p =>
        (p.name || "").toLowerCase().includes(k) ||
        (p.ko || "").toLowerCase().includes(k)
    );

    render(filtered);
});

/* =========================
MODAL
========================= */

async function openModal(p) {

    const postId = String(p.no);

    modal.classList.remove("hidden");

    modalBody.innerHTML = `
        <h2>${p.name}</h2>

        <div class="commentArea">
            <textarea id="commentInput"></textarea>
            <button id="commentBtn">등록</button>
            <div id="comments"></div>
        </div>
    `;

    const commentInput = modalBody.querySelector("#commentInput");
    const commentBtn = modalBody.querySelector("#commentBtn");
    const commentsDiv = modalBody.querySelector("#comments");

    /* =========================
    COMMENT LOAD
    ========================= */

    async function loadComments() {

        const snap = await getDocs(
            collection(db, "people", postId, "comments")
        );

        const list = snap.docs.map(d => ({ id: d.id, ...d.data() }));

        commentsDiv.innerHTML = "";

        list.forEach(c => {
            const el = document.createElement("div");
            el.textContent = `${c.name}: ${c.text}`;
            el.id = `comment-${c.id}`;
            commentsDiv.appendChild(el);
        });
    }

    /* =========================
    ADD COMMENT
    ========================= */

    commentBtn.onclick = async () => {

        const text = commentInput.value.trim();
        if (!text) return;

        const user = auth.currentUser || await login();

        const ref = await addDoc(
            collection(db, "people", postId, "comments"),
            {
                uid: user.uid,
                name: user.displayName || user.email,
                text,
                parentId: null,
                createdAt: serverTimestamp()
            }
        );

        await addDoc(collection(db, "notifications"), {
            targetUid: ADMIN_UID,
            senderUid: user.uid,
            senderName: user.displayName || user.email,
            postId: String(p.no),
            commentId: ref.id,
            type: "comment",
            read: false,
            createdAt: serverTimestamp()
        });

        commentInput.value = "";
        loadComments();
    };

    await loadComments();
}

/* =========================
AUTH
========================= */

document.getElementById("loginBtn").onclick = login;
document.getElementById("logoutBtn").onclick = logout;

watchAuth(user => {

    currentUser = user;

    const info = document.getElementById("userInfo");

    if (!user) {
        info.textContent = "로그인 안 됨";
        return;
    }

    info.textContent = user.email;

    /* =========================
    NOTIFICATIONS REALTIME
    ========================= */

    if (notifUnsub) notifUnsub();

    notifUnsub = onSnapshot(
        query(collection(db, "notifications"),
            where("targetUid", "==", user.uid)
        ),
        snap => {

            const list = snap.docs.map(d => ({ id: d.id, ...d.data() }));

            const unread = list.filter(n => !n.read).length;
            document.getElementById("badge").textContent = unread;

            const box = document.getElementById("notificationList");
            box.innerHTML = "";

            list.forEach(n => {

                const div = document.createElement("div");
                div.textContent = `${n.senderName} 댓글`;

                div.onclick = async () => {

                    await updateDoc(doc(db, "notifications", n.id), {
                        read: true
                    });

                    const target = document.getElementById(`comment-${n.commentId}`);
                    if (target) target.scrollIntoView({ behavior: "smooth" });
                };

                box.appendChild(div);
            });
        }
    );
});

/* =========================
INIT RENDER
========================= */

render(data);

/* =========================
MODAL CLOSE
========================= */

closeModal.onclick = () => modal.classList.add("hidden");

modal.onclick = (e) => {
    if (e.target === modal) modal.classList.add("hidden");
};

</script>

</body>
</html>
