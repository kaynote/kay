<script type="module">

import people from "./people.js?v=10";

import {
    db,
    auth,
    login,
    logout,
    watchAuth
} from "./firebase.js";

import {
    collection,
    getDocs,
    addDoc,
    deleteDoc,
    doc,
    setDoc,
    getDoc,
    updateDoc,
    query,
    orderBy,
    serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.0.0/firebase-firestore.js";

/* =========================
   CONFIG
========================= */

const ADMIN_EMAIL = "ektjttnfp5@gmail.com";

/* =========================
   DOM
========================= */

const container = document.getElementById("peopleContainer");
const searchBox = document.getElementById("searchBox");
const modal = document.getElementById("modal");
const modalBody = document.getElementById("modalBody");
const closeModal = document.getElementById("closeModal");

const loginBtn = document.getElementById("loginBtn");
const logoutBtn = document.getElementById("logoutBtn");

/* =========================
   STATE
========================= */

let data = [];
let renderedMap = new Map();

/* =========================
   INIT
========================= */

function init(){
    if(!Array.isArray(people)) return;
    data = people;
    render(data);
}

/* =========================
   CARD
========================= */

function createCard(p, index){

    const card = document.createElement("div");
    card.className = "card";

    const img = document.createElement("img");
    img.src = p.image ? "images/" + p.image : "images/no-image.jpg";
    img.loading = "lazy";

    const photo = document.createElement("div");
    photo.className = "photo";
    photo.appendChild(img);

    const info = document.createElement("div");
    info.className = "info";

    const nameEl = document.createElement("div");
    nameEl.className = "name";

    const no = p.no || (index + 1);

    nameEl.innerHTML = `
        <span class="num">${no}.</span>
        <span class="txt">${p.name || ""}</span>
    `;

    if(p.ko){
        const koEl = document.createElement("div");
        koEl.className = "ko";
        koEl.textContent = p.ko;
        nameEl.appendChild(koEl);
    }

    const metaEl = document.createElement("div");
    metaEl.className = "meta";
    metaEl.textContent = p.tags ? p.tags.join(" · ") : "";

    const descEl = document.createElement("div");
    descEl.className = "desc";
    descEl.innerHTML = p.note || "";

    info.appendChild(nameEl);
    info.appendChild(metaEl);
    info.appendChild(descEl);

    card.appendChild(photo);
    card.appendChild(info);

    card.addEventListener("click", () => openModal(p));

    return card;
}

/* =========================
   RENDER
========================= */

function render(list){

    const fragment = document.createDocumentFragment();

    list.forEach((p, index)=>{

        const key = (p.no || index) + "_" + p.name;

        if(renderedMap.has(key)){
            fragment.appendChild(renderedMap.get(key));
        } else {
            const card = createCard(p, index);
            renderedMap.set(key, card);
            fragment.appendChild(card);
        }
    });

    container.replaceChildren(fragment);
}

/* =========================
   SEARCH
========================= */

function debounce(fn, delay = 150){
    let t;
    return (...args)=>{
        clearTimeout(t);
        t = setTimeout(()=>fn(...args), delay);
    };
}

const handleSearch = debounce(value=>{
    const k = value.toLowerCase();

    const filtered = data.filter(p =>
        (p.name || "").toLowerCase().includes(k) ||
        (p.ko || "").toLowerCase().includes(k) ||
        (p.note || "").toLowerCase().includes(k)
    );

    render(filtered);
});

searchBox.addEventListener("input", e=>{
    handleSearch(e.target.value);
});

/* =========================
   MODAL (핵심 수정 부분)
========================= */

function formatDate(ts){
    if(!ts) return "";
    const d = ts.toDate();

    return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")} ${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`;
}

async function openModal(p) {

    const personName = p.name;

    modal.classList.remove("hidden");

    modalBody.innerHTML = `
        <img class="modal-photo" src="images/${p.image || 'no-image.jpg'}">

        <div class="modal-name">${p.displayName || p.name}</div>
        <div class="modal-desc">${p.note || ""}</div>

        <div class="likeArea">
            <button class="likeBtn">👍 좋아요</button>
            <span class="likeCount">0</span>
        </div>

        <div class="commentArea">
            <textarea class="commentInput" placeholder="댓글 입력"></textarea>
            <button class="commentBtn">등록</button>
            <div class="comments"></div>
        </div>
    `;

    const likeBtn = modalBody.querySelector(".likeBtn");
    const likeCountEl = modalBody.querySelector(".likeCount");
    const commentBtn = modalBody.querySelector(".commentBtn");
    const commentInput = modalBody.querySelector(".commentInput");
    const commentsDiv = modalBody.querySelector(".comments");

    /* =========================
       LIKE LOAD
    ========================= */

    async function loadLikes(){
        const snap = await getDocs(collection(db, "people", personName, "likes"));
        likeCountEl.textContent = snap.size;
    }

    /* =========================
       LIKE TOGGLE (핵심)
    ========================= */

    likeBtn.onclick = async () => {
        try {
            const user = auth.currentUser || await login();

            const ref = doc(db, "people", personName, "likes", user.uid);
            const snap = await getDoc(ref);

            if (snap.exists()) {
                await deleteDoc(ref);
            } else {
                await setDoc(ref, {
                    uid: user.uid,
                    name: user.displayName || user.email || "익명",
                    photo: user.photoURL,
                    createdAt: serverTimestamp()
                });
            }

            await loadLikes();

        } catch (e) {
            console.error("좋아요 실패:", e);
            alert("좋아요 실패");
        }
    };

    /* =========================
       COMMENTS LOAD
    ========================= */

    async function loadComments(){

        const q = query(
            collection(db, "people", personName, "comments"),
            orderBy("createdAt", "desc")
        );

        const snap = await getDocs(q);

        commentsDiv.innerHTML = "";

        snap.forEach(docSnap => {

            const c = docSnap.data();
            const commentId = docSnap.id;

            const div = document.createElement("div");
            div.className = "comment";

            div.innerHTML = `
                <div class="commentRow">
                    <div class="left">
                        <span class="name">${c.name}</span>
                    </div>
                    <div class="text">${c.text}</div>
                    <div class="right">${c.createdAt ? formatDate(c.createdAt) : ""}</div>
                </div>

                <div class="commentActions">
                    <button class="replyBtn">답글</button>
                </div>

                <div class="replies"></div>
            `;

            const replyBtn = div.querySelector(".replyBtn");
            const repliesDiv = div.querySelector(".replies");

            /* =========================
               LOAD REPLIES
            ========================= */

            async function loadReplies(){

                const rq = query(
                    collection(db, "people", personName, "comments", commentId, "replies"),
                    orderBy("createdAt", "asc")
                );

                const rsnap = await getDocs(rq);

                repliesDiv.innerHTML = "";

                rsnap.forEach(rdoc => {
                    const r = rdoc.data();

                    const rdiv = document.createElement("div");
                    rdiv.className = "reply";

                    rdiv.innerHTML = `
                        <span>${r.name}</span>
                        <span>${r.text}</span>
                    `;

                    repliesDiv.appendChild(rdiv);
                });
            }

            loadReplies();

            /* =========================
               REPLY ADD
            ========================= */

            replyBtn.onclick = async () => {
                const text = prompt("답글");
                if (!text) return;

                const user = auth.currentUser || await login();

                await addDoc(
                    collection(db, "people", personName, "comments", commentId, "replies"),
                    {
                        uid: user.uid,
                        name: user.displayName || "익명",
                        text,
                        createdAt: serverTimestamp()
                    }
                );

                loadReplies();
            };

            commentsDiv.appendChild(div);
        });
    }

    /* =========================
       COMMENT ADD
    ========================= */

    commentBtn.onclick = async () => {

        try {
            const text = commentInput.value.trim();
            if (!text) return;

            const user = auth.currentUser || await login();

            await addDoc(
                collection(db, "people", personName, "comments"),
                {
                    uid: user.uid,
                    name: user.displayName || user.email || "익명",
                    text,
                    createdAt: serverTimestamp()
                }
            );

            commentInput.value = "";
            loadComments();

        } catch (e) {
            console.error(e);
            alert("댓글 실패");
        }
    };

    await loadLikes();
    await loadComments();
}

/* =========================
   CLOSE MODAL
========================= */

closeModal.onclick = () => modal.classList.add("hidden");
modal.onclick = (e) => { if(e.target === modal) modal.classList.add("hidden"); };

/* =========================
   AUTH
========================= */

loginBtn.onclick = login;
logoutBtn.onclick = logout;

watchAuth(user=>{
    const userInfo = document.getElementById("userInfo");

    if(!user){
        userInfo.textContent = "로그인 안 됨";
        return;
    }

    userInfo.textContent = user.email;
});

/* =========================
   START
========================= */

init();

</script>
